<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>DigiDex v4 — Digizo.nu</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --dz-navy:#1b1e4c;--dz-purple:#7a00df;--dz-purple-mid:#8448a2;
  --dz-purple-light:#c1a3d0;--dz-purple-pale:#f5f0fb;
  --dz-teal:#5ad1c4;--dz-teal-light:#ace8e1;--dz-teal-pale:#eaf9f7;
  --dz-text:#2a2a2a;--dz-muted:#6b6b6b;--dz-border:#ddd6e8;--dz-bg:#f7f5fc;
  --s-vvt:#1b1e4c;--s-vvt-bg:#e8e9f0;
  --s-ggz:#7a00df;--s-ggz-bg:#f3edf8;--s-ggz-mid:#9e3ee8;
  --s-ha:#0a6e50;--s-ha-bg:#e1f5ee;--s-ha-mid:#1a9870;
  --s-hap:#375454;--s-hap-bg:#e6f0f0;
  --s-msz:#2d4a6e;--s-msz-bg:#e4ecf5;--s-msz-mid:#4a72a0;
  --s-sd:#0a8a80;--s-sd-bg:#e0f5f3;--s-sd-mid:#12b0a4;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--dz-bg);color:var(--dz-text);min-height:100vh;padding:24px 16px 48px}

/* ── Page header ── */
.page-header{max-width:920px;margin:0 auto 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-logo{height:36px}
.page-title{font-size:1.25rem;font-weight:700;color:var(--dz-navy)}
.page-sub{font-size:.8rem;color:var(--dz-muted);margin-left:auto}

/* ── Source bar ── */
.source-bar{max-width:920px;margin:0 auto 16px;display:flex;gap:8px;flex-wrap:wrap}
.src-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;border:2px solid var(--dz-border);background:#fff;font-size:.8rem;font-weight:600;color:var(--dz-muted);cursor:pointer;transition:all .15s}
.src-btn:hover{border-color:var(--dz-purple-light);color:var(--dz-purple)}
.src-btn.active{border-color:var(--dz-purple);background:var(--dz-purple-pale);color:var(--dz-purple)}
.src-count{background:var(--dz-border);color:var(--dz-muted);border-radius:10px;padding:1px 7px;font-size:.72rem;font-weight:700}
.src-btn.active .src-count{background:var(--dz-purple);color:#fff}

/* ── Outer machine ── */
.machine-wrap{max-width:920px;margin:0 auto;display:flex;gap:16px;align-items:flex-start}
.machine{width:760px;flex-shrink:0;background:#fff;border-radius:18px;border:1.5px solid var(--dz-border);box-shadow:0 4px 24px rgba(27,30,76,.07);overflow:hidden;position:relative}

/* ── Nav bar ── */
.nav-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--dz-navy);border-bottom:2px solid rgba(255,255,255,.08)}
.nav-arrow{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}
.nav-arrow:hover{background:rgba(255,255,255,.25)}
.nav-arrow:disabled{opacity:.3;cursor:default}
.nav-center{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;padding:0 12px}
.nav-counter{color:rgba(255,255,255,.7);font-size:.72rem;font-weight:500}
.pips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:480px}
.pip{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .15s;flex-shrink:0}
.pip.active{background:var(--dz-teal);transform:scale(1.3)}
.pip:hover{background:rgba(255,255,255,.5)}

/* ── Card slot ── */
.card-slot{min-height:440px}
.card{display:none;flex-direction:column}
.card.visible{display:flex}

/* ── Card header ── */
.card-head{padding:16px 20px 12px;border-bottom:1px solid var(--dz-border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-head-left{display:flex;flex-direction:column;gap:6px}
.card-proc-link{font-size:1rem;font-weight:700;color:var(--dz-navy);text-decoration:none;line-height:1.3}
.card-proc-link:hover{color:var(--dz-purple);text-decoration:underline}
.card-pills{display:flex;gap:5px;flex-wrap:wrap}
.pill{padding:2px 9px;border-radius:10px;font-size:.7rem;font-weight:700;letter-spacing:.02em}
.card-badge-row{display:flex;gap:6px;align-items:center}
.src-badge{font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:8px;letter-spacing:.04em}
.src-badge.stoz{background:#e8e9f0;color:#1b1e4c}
.src-badge.zonmw{background:var(--dz-purple-pale);color:var(--dz-purple)}

/* ── Band (shared) ── */
.band{padding:14px 18px}
.band+.band{border-top:1px solid var(--dz-border)}
.band-label{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.band-label .band-tag{padding:2px 8px;border-radius:6px;font-size:.65rem;font-weight:700}
.band-ph{background:var(--dz-bg);border:1.5px dashed var(--dz-border);border-radius:10px;padding:14px 16px;text-align:center;color:var(--dz-muted);font-size:.78rem}

/* ── Timeline ── */
.tl-wrap{position:relative;margin-bottom:6px}
.tl-bar{display:flex;border-radius:6px;overflow:hidden;height:28px;position:relative}
.tl-seg{display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;overflow:hidden;white-space:nowrap;padding:0 4px;cursor:default;transition:filter .15s}
.tl-seg:hover{filter:brightness(1.1)}
.tl-nu{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--dz-teal);border-radius:2px;pointer-events:none;z-index:10}
.tl-nu::after{content:'nu';position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:.58rem;font-weight:700;color:var(--dz-teal);white-space:nowrap}
.tl-axis{display:flex;position:relative;height:16px;margin-top:3px}
.tl-tick{position:absolute;font-size:.6rem;color:var(--dz-muted);transform:translateX(-50%)}
.tl-tick.right{transform:translateX(-100%)}

/* ── STOZ route ── */
.stoz-route-pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.route-pill{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:.68rem;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .15s}
.route-pill:hover{opacity:.85}
.route-pill .rp-count{font-weight:800}

/* STOZ segment colors */
.seg-strat{background:#3d3f9e;color:#fff}
.seg-impl{background:#d97706;color:#fff}
.seg-opsch{background:#059669;color:#fff}
.seg-eval{background:#2563eb;color:#fff}

.rp-strat{background:#e8e9f6;color:#3d3f9e;border-color:#3d3f9e30}
.rp-impl{background:#fef3c7;color:#d97706;border-color:#d9770630}
.rp-opsch{background:#d1fae5;color:#059669;border-color:#05966930}
.rp-eval{background:#dbeafe;color:#2563eb;border-color:#2563eb30}

/* ── Kennis section ── */
.kennis-section{margin-top:10px;background:var(--dz-teal-pale);border-radius:8px;padding:10px 12px}
.kennis-title{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--dz-navy);margin-bottom:6px}
.kennis-text{font-size:.72rem;color:var(--dz-text);line-height:1.5}

/* ── ZonMw band ── */
.zm-meta{font-size:.7rem;color:var(--dz-muted);margin-bottom:8px}
.zm-tl-wrap{position:relative;margin-bottom:6px}
.zm-orgs-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.zm-org-group{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}
.zm-org-group-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dz-muted);margin-bottom:2px}
.org-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:.7rem;font-weight:600;cursor:pointer;background:var(--dz-purple-pale);color:var(--dz-purple);border:1.5px solid var(--dz-purple-light);transition:all .15s;margin-bottom:3px}
.org-tag:hover{background:var(--dz-purple);color:#fff}
.voucher-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;font-size:.67rem;font-weight:600;cursor:pointer;background:#fff;color:var(--dz-muted);border:1.5px solid var(--dz-border);transition:all .15s;margin-bottom:3px}
.voucher-tag:hover{border-color:var(--dz-purple);color:var(--dz-purple)}
.stoz-cross-ref{margin-top:8px;padding-top:7px;border-top:1px dashed var(--dz-border)}
.stoz-org-pill{font-size:.67rem;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border:1px solid;cursor:pointer;background:#fff8e1;color:#e65100;border-color:#ffcc02;transition:filter .15s;margin:2px}
.stoz-org-pill:hover{filter:brightness(0.9)}
.stoz-badge{font-size:.55rem;font-weight:700;padding:1px 5px;border-radius:10px;background:#e8a000;color:#fff}
.route-indicator-mini{font-size:.55rem;padding:1px 4px;border-radius:8px;font-weight:700}
.route-opsch{background:#e8f5e9;color:#2e7d32}
.route-eval{background:#e3f2fd;color:#1565c0}
.route-impl{background:#fff3e0;color:#e65100}
.route-strat{background:#e8eaf6;color:#3949ab}
.kennis-empty{font-size:.67rem;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:5px;background:#f5f5f5;color:#9e9e9e;border:1px solid #e0e0e0;cursor:default;font-style:italic;opacity:.7}
.v-lbl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dz-muted);width:100%;display:flex;align-items:center;gap:6px;margin-bottom:4px}

/* ── STOZ org tags ── */
.stoz-org-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:.7rem;font-weight:600;cursor:pointer;background:var(--dz-bg);color:var(--dz-navy);border:1.5px solid var(--dz-border);transition:all .15s;margin-bottom:3px}
.stoz-org-tag:hover{border-color:var(--dz-navy);background:var(--dz-navy);color:#fff}

/* ── Card footer ── */
.card-footer{padding:10px 18px;background:var(--dz-bg);border-top:1px solid var(--dz-border);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.footer-text{font-size:.65rem;color:var(--dz-muted)}
.footer-link{font-size:.65rem;color:var(--dz-purple);text-decoration:none;font-weight:600}
.footer-link:hover{text-decoration:underline}

/* ── In-card Drawer ── */
.drawer-overlay{display:none;position:absolute;inset:0;background:rgba(27,30,76,.18);z-index:40;backdrop-filter:blur(1px);border-radius:18px}
.drawer-overlay.open{display:block}
.drawer{position:absolute;right:0;top:0;bottom:0;width:320px;background:#fff;border-left:2px solid var(--dz-border);border-radius:0 18px 18px 0;z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);overflow:hidden}
.drawer.open{transform:translateX(0)}
.drawer-head{padding:14px 16px 10px;border-bottom:1px solid var(--dz-border);display:flex;align-items:flex-start;gap:10px}
.drawer-icon{font-size:1.6rem;flex-shrink:0;line-height:1}
.drawer-head-text{flex:1;min-width:0}
.drawer-title{font-size:.9rem;font-weight:700;color:var(--dz-navy);line-height:1.3}
.drawer-sub{font-size:.72rem;color:var(--dz-muted);margin-top:2px}
.drawer-close{background:none;border:none;cursor:pointer;color:var(--dz-muted);font-size:1.2rem;flex-shrink:0;line-height:1;padding:0 2px;transition:color .15s}
.drawer-close:hover{color:var(--dz-navy)}
.drawer-body{flex:1;overflow-y:auto;padding:14px 16px}
.drawer-section{margin-bottom:14px}
.drawer-section-title{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--dz-muted);margin-bottom:6px}
.drawer-row{display:flex;gap:8px;margin-bottom:5px}
.drawer-row-label{font-size:.72rem;font-weight:600;color:var(--dz-muted);min-width:80px;flex-shrink:0}
.drawer-row-val{font-size:.72rem;color:var(--dz-text);line-height:1.4}
.drawer-contacts{display:flex;flex-direction:column;gap:8px}
.contact-card{background:var(--dz-bg);border-radius:8px;padding:10px 12px}
.contact-name{font-size:.78rem;font-weight:700;color:var(--dz-navy)}
.contact-role{font-size:.68rem;color:var(--dz-muted);margin-top:1px}
.contact-links{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap}
.contact-link{font-size:.65rem;color:var(--dz-purple);text-decoration:none;font-weight:600}
.contact-link:hover{text-decoration:underline}
.drawer-btn{display:block;width:100%;padding:9px 14px;border-radius:9px;border:none;font-size:.78rem;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;transition:all .15s;margin-top:6px}
.drawer-btn.primary{background:var(--dz-purple);color:#fff}
.drawer-btn.primary:hover{background:#6200c0}
.drawer-btn.secondary{background:var(--dz-bg);color:var(--dz-navy);border:1.5px solid var(--dz-border)}
.drawer-btn.secondary:hover{border-color:var(--dz-navy)}
.drawer-kennis{background:var(--dz-teal-pale);border-radius:8px;padding:10px 12px;margin-top:8px}
.drawer-kennis-title{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--dz-navy);margin-bottom:5px}
.drawer-kennis-text{font-size:.72rem;color:var(--dz-text);line-height:1.5}

/* ── Sector tabs (right sidebar) ── */
.sector-tabs{display:flex;flex-direction:column;gap:6px;padding-top:4px}
.sec-tab{padding:7px 12px;border-radius:10px;border:1.5px solid var(--dz-border);background:#fff;font-size:.72rem;font-weight:700;cursor:pointer;text-align:left;color:var(--dz-muted);transition:all .15s;white-space:nowrap}
.sec-tab:hover{border-color:var(--dz-purple-light);color:var(--dz-purple)}
.sec-tab.active{color:#fff;border-color:transparent}
.sec-tab .tab-count{display:inline-block;background:rgba(255,255,255,.25);border-radius:8px;padding:1px 6px;font-size:.65rem;margin-left:4px}
.sec-tab:not(.active) .tab-count{background:var(--dz-border);color:var(--dz-muted)}

/* ── Responsive ── */
@media(max-width:860px){
  .machine-wrap{flex-direction:column}
  .machine{width:100%}
  .sector-tabs{flex-direction:row;flex-wrap:wrap}
}

/* ── STOZ route-balken (3 parallelle routes, geen continuüm) ── */
.stoz-routes { padding: 8px 0 4px; }
.stoz-route-row {
  display: flex; align-items: center; gap: 10px;
  padding: 5px 0; border-bottom: 1px solid var(--dz-border);
  cursor: help;
}
.stoz-route-row:last-of-type { border-bottom: none; }
.stoz-route-row.stoz-eval-empty { opacity: 0.65; }
.stoz-route-label {
  min-width: 160px; flex-shrink: 0;
  display: flex; flex-direction: column; gap: 1px;
}
.stoz-route-name {
  font-size: 11px; font-weight: 600; color: var(--dz-navy);
}
.stoz-route-sub {
  font-size: 9px; color: var(--dz-muted); font-style: italic;
}
.stoz-bar-wrap { flex: 1; min-width: 0; }
.stoz-bar-bg {
  width: 100%; height: 20px; background: #f0edf7;
  border-radius: 4px; overflow: hidden;
  position: relative; display: flex; align-items: center;
}
.stoz-bar-fill {
  height: 100%; border-radius: 4px;
  display: flex; align-items: center;
  transition: width 0.3s ease;
  min-width: 0; position: relative;
}
.stoz-bar-count {
  font-size: 10px; font-weight: 700;
  padding: 0 6px; white-space: nowrap;
}
.stoz-bar-count-outside {
  font-size: 10px; font-weight: 700;
  padding: 0 6px; white-space: nowrap;
}
.stoz-eval-note {
  font-size: 9px; color: #9e9e9e; padding-left: 8px;
  font-style: italic;
}
.stoz-route-total {
  display: flex; justify-content: space-between;
  font-size: 10px; color: var(--dz-muted);
  padding: 6px 0 2px; border-top: 1px dashed var(--dz-border);
  margin-top: 4px;
}
.stoz-route-total strong { color: var(--dz-navy); }
/* Verwijder oude seg-strat/seg-impl/seg-opsch/seg-eval als ze nog ergens staan */
.tl-seg.seg-strat, .tl-seg.seg-impl,
.tl-seg.seg-opsch, .tl-seg.seg-eval { display: none; }


/* ── STOZ aanvragers-sectie ── */
.stoz-orgs-section { margin-top: 10px; }
.stoz-org-group { margin-bottom: 8px; }
.stoz-org-label {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  letter-spacing: .07em; color: var(--dz-muted); margin-bottom: 4px;
}
.stoz-org-tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 600; padding: 3px 9px;
  border-radius: 20px; border: 1px solid; margin: 2px 3px 2px 0;
  cursor: pointer; transition: filter .15s;
}
.stoz-org-tag:hover { filter: brightness(.88); }
.stoz-tag-opsch { background: #e8f5e9; color: #1b5e20; border-color: #81c784; }
.stoz-tag-eval  { background: #e3f2fd; color: #0d3d73; border-color: #42a5f5; }
.stoz-kennis-mini { font-size: 11px; }

/* ── STOZ leveranciers / technologieën ── */
.stoz-lev-section { margin-top: 8px; }
.stoz-lev-row { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.stoz-lev-pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 10px; font-weight: 600; padding: 3px 9px;
  border-radius: 20px; border: 1px solid #fcd34d;
  background: #fffbeb; color: #78350f;
}
.stoz-lev-badge {
  font-size: 8px; font-weight: 700; padding: 1px 4px;
  border-radius: 8px; background: #d97706; color: #fff;
}

/* ── STOZ footer ── */
.stoz-footer {
  font-size: 9px; color: var(--dz-muted); margin-top: 8px;
  padding-top: 6px; border-top: .5px solid var(--dz-border);
}


/* ── AAN1: Route-tags conform org-tag stijl ── */
.stoz-route-tag-row { display: flex; flex-wrap: wrap; gap: 4px; }
.stoz-tag-impl {
  background: #fff3e0 !important; color: #7c3300 !important;
  border-color: #ffb74d !important;
}
.stoz-tag-impl:hover { background: #ffe0b2 !important; }
.stoz-tag-opsch-main {
  background: #e8f5e9 !important; color: #1b5e20 !important;
  border-color: #81c784 !important;
}
.stoz-tag-opsch-main:hover { background: #c8e6c9 !important; }
.stoz-tag-eval-main {
  background: #e3f2fd !important; color: #0d3d73 !important;
  border-color: #42a5f5 !important;
}
.stoz-tag-eval-main:hover { background: #bbdefb !important; }
.route-count {
  display: inline-block; font-size: 11px; font-weight: 700;
  background: rgba(0,0,0,.10); border-radius: 10px;
  padding: 0 5px; margin-left: 4px; line-height: 1.6;
}

/* ── AAN2: STOZ-infokaart ── */
.stoz-info-card { border-top: 3px solid #f59e0b; }
.stoz-info-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
  margin-top: 8px;
}
@media (max-width: 800px) { .stoz-info-grid { grid-template-columns: 1fr; } }
.stoz-info-route {
  border-radius: 8px; padding: 10px 12px;
  border: 1px solid; font-size: .7rem;
}
.stoz-info-impl  { background: #fff8f0; border-color: #ffb74d; }
.stoz-info-opsch { background: #f0fdf4; border-color: #86efac; }
.stoz-info-eval  { background: #eff6ff; border-color: #93c5fd; }
.stoz-info-route-title {
  font-size: .72rem; font-weight: 700; margin-bottom: 2px; color: var(--dz-navy);
}
.stoz-info-route-sub {
  font-size: .62rem; color: var(--dz-muted); margin-bottom: 6px;
}
.stoz-info-route-desc { font-size: .68rem; line-height: 1.5; color: var(--dz-navy); }
.stoz-info-table-wrap { overflow-x: auto; margin-top: 8px; }
.stoz-info-table {
  width: 100%; border-collapse: collapse; font-size: .68rem;
}
.stoz-info-table th {
  font-size: .6rem; font-weight: 700; text-transform: uppercase;
  letter-spacing: .06em; color: var(--dz-muted);
  border-bottom: 1px solid var(--dz-border); padding: 4px 6px;
  text-align: left;
}
.stoz-info-table td { padding: 3px 6px; border-bottom: .5px solid var(--dz-border); }
.stoz-info-table tr:hover td { background: var(--dz-teal-pale); }
.stoz-info-table .tc { text-align: center; }
.impl-cell  { color: #7c3300; font-weight: 600; }

// HELPERS
// ─────────────────────────────────────────────
function hasStoz(proc){ return proc.stoz && STOZ_ROUTE_DATA[proc.stoz]; }
function hasZonmw(proc){ return proc.zonmw && ZONMW_CARDS[proc.zonmw]; }

function bronMatch(proc, bron){
  const s = hasStoz(proc), z = hasZonmw(proc);
  if(bron==='all') return true;
  if(bron==='stoz') return s;
  if(bron==='zonmw') return z;
  if(bron==='both') return s && z;
  return true;
}
function sectorMatch(proc, sec){
  if(sec==='all') return true;
  return proc.sectoren.includes(sec);
}

// stoNuPct verwijderd: STOZ-routes zijn geen continuüm
function zmNuPct(tlStart, tlEnd){
  const s = new Date(tlStart), e = new Date(tlEnd);
  return Math.max(0, Math.min(100, (TODAY - s)/(e - s)*100));
}

function e(tag, cls, html){
  const el = document.createElement(tag);
  if(cls) el.className = cls;
  if(html != null) el.innerHTML = html;
  return el;
}

function buildStozBand(proc){
  const d  = STOZ_ROUTE_DATA[proc.stoz];
  const vd = STOZ_VWS_DATA[proc.stoz] || STOZ_VWS_DATA[proc.naam] || null;
  const wrap = e('div','band');

  // Band header
  const lbl = e('div','band-label');
  lbl.innerHTML = `<span class="band-tag" style="background:#fff3cd;color:#856404;border:1px solid #ffc107">STOZ</span> ${proc.stoz || proc.naam}`;
  wrap.appendChild(lbl);

  if(!d){
    wrap.appendChild(e('div','band-ph','Geen STOZ-routedata beschikbaar voor dit proces'));
    return wrap;
  }

  // ── COMPACTE ROUTESAMENVATTING (detail via drawer) ──────────────────
  // Route-samenvatting: gebruik org-tag stijl conform de rest van de kaart
  const routeSummary = e('div','zm-orgs-row');  // zelfde container als ZonMw

  const routeGrp = e('div','zm-org-group');
  routeGrp.appendChild(e('div','zm-org-group-label','Subsidieroutes STOZ 2024/2025'));

  const tagRow = e('div','stoz-route-tag-row');

  if(d.impl){
    const tag = e('span','org-tag stoz-tag-impl');
    tag.title = 'Implementatiestart-route: eerste inzet van technologie, incl. strategievorming. Klik voor details.';
    tag.innerHTML = `Impl. &amp; Strat. <span class="route-count">${d.impl}</span>`;
    tag.onclick = () => openStozDrawer(proc, null);
    tagRow.appendChild(tag);
  }
  if(d.opsch){
    const tag = e('span','org-tag stoz-tag-opsch-main');
    tag.title = 'Opschalingsroute: technologie uitrollen naar meer locaties. Kennisinstituut optioneel. Klik voor details.';
    tag.innerHTML = `Opschaling <span class="route-count">${d.opsch}</span>`;
    tag.onclick = () => openStozDrawer(proc, null);
    tagRow.appendChild(tag);
  }
  if(d.eval){
    const tag = e('span','org-tag stoz-tag-eval-main');
    tag.title = 'Evaluatieroute: wetenschappelijke effectmeting. Kennisinstituut verplicht per subsidieregeling. Klik voor details.';
    tag.innerHTML = `Evaluatie ✶ <span class="route-count">${d.eval}</span>`;
    tag.onclick = () => openStozDrawer(proc, null);
    tagRow.appendChild(tag);
  }

  routeGrp.appendChild(tagRow);
  routeSummary.appendChild(routeGrp);
  wrap.appendChild(routeSummary);

  // ── AANVRAGERS (alle 3 routes: Impl./Strat., Opschaling, Evaluatie) ─────
  if(vd && vd.aanvragers && vd.aanvragers.length > 0){
    const orgsSection = e('div','stoz-orgs-section');
    const implAanvr  = vd.aanvragers.filter(a => a.r === 'impl');
    const opschAanvr = vd.aanvragers.filter(a => a.r === 'opsch');
    const evalAanvr  = vd.aanvragers.filter(a => a.r === 'eval');

    function makeAanvrGroup(label, aanvrs, tagClass, routeKey){
      if(!aanvrs.length) return;
      const grp = e('div','zm-org-group');
      grp.appendChild(e('div','zm-org-group-label', label));
      const tagRow = e('div','org-tags');
      aanvrs.forEach(a => {
        const tag = e('span','org-tag ' + tagClass);
        tag.title = (a.k ? 'Kennisinstituut: ' + a.k + ' | ' : '') +
                    (a.l && a.l.length ? 'Tech: ' + a.l.join(', ') : 'Klik voor details');
        tag.innerHTML = a.a + (a.k ? ` <span style="font-size:10px">🎓</span>` : '');
        tag.onclick = () => openStozDrawer(proc, a);
        tagRow.appendChild(tag);
      });
      grp.appendChild(tagRow);
      orgsSection.appendChild(grp);
    }

    makeAanvrGroup('Implementatiestart & Strategievorming', implAanvr,  'stoz-tag-impl',       'impl');
    makeAanvrGroup('Opschalingsroute',                       opschAanvr, 'stoz-tag-opsch-main', 'opsch');
    makeAanvrGroup('Evaluatieroute ✶',                       evalAanvr,  'stoz-tag-eval-main',  'eval');

    wrap.appendChild(orgsSection);
  }

  // ── TECHNOLOGIEËN / LEVERANCIERS ──────────────────────────────────────
  if(vd && vd.leveranciers && vd.leveranciers.length > 0){
    const levSection = e('div','stoz-lev-section');
    levSection.appendChild(e('div','stoz-org-label','Geïmplementeerde technologieën (uit goedgekeurde projecten)'));
    const levRow = e('div','stoz-lev-row');
    vd.leveranciers.forEach(l => {
      const pill = e('span','stoz-lev-pill');
      pill.innerHTML = `<span class="stoz-lev-badge">TECH</span>${l}`;
      levRow.appendChild(pill);
    });
    levSection.appendChild(levRow);
    wrap.appendChild(levSection);
  }

  // ── KENNISINSTITUUT-SECTIE ────────────────────────────────────────────
  wrap.appendChild(buildKennisSectie(proc, vd));

  // Footer
  const footer = e('div','stoz-footer');
  footer.innerHTML = `STOZ 2024/2025 · RVO · <a href="https://www.rvo.nl/subsidies-financiering/stoz" target="_blank" style="color:#856404">↗ rvo.nl</a>`;
  wrap.appendChild(footer);

  return wrap;
}


function buildKennisSectie(proc, vd){
  const d = STOZ_ROUTE_DATA[proc.stoz];
  const wrap = e('div','stoz-org-group');  // zelfde container als aanvragers

  // Label — conform de rest van de kaart
  const lbl = e('div','stoz-org-label');
  lbl.innerHTML = 'Kennisinstituut-participatie <span class="stoz-eval-eis-inline" title="Bij de Evaluatieroute is deelname van een kennisinstituut verplicht per STOZ-subsidieregeling">✶ verplicht bij Evaluatieroute</span>';
  wrap.appendChild(lbl);

  const kennisEntries = (vd && vd.kennis) ? vd.kennis : [];

  if(kennisEntries.length > 0){
    kennisEntries.forEach(([naam, type]) => {
      const tag = e('span','stoz-org-tag stoz-tag-kennis');
      tag.title = `${naam} — ${type} · Klik voor details`;
      tag.innerHTML = `🎓 ${naam} <span class="stoz-kennis-type">${type}</span>`;
      // onclick: open drawer met kennis-aanvrager als er een aanvrager is met dit kennis-type
      tag.onclick = () => {
        const vd2 = STOZ_VWS_DATA[proc.stoz] || STOZ_VWS_DATA[proc.naam] || null;
        const kennisAanvr = vd2 && vd2.aanvragers
          ? vd2.aanvragers.find(a => a.k && a.k === type)
          : null;
        if(kennisAanvr){
          openStozDrawer(proc, kennisAanvr);
        } else {
          // Fallback: open drawer met het proces, toon kennis in titel
          openStozDrawer(proc, {a: naam, k: type, l:[], r:'opsch'});
        }
      };
      wrap.appendChild(tag);
    });
  } else if(d && d.eval > 0){
    // Evaluatieroute aanwezig maar geen kennis gedetecteerd → amber waarschuwing
    const tag = e('span','stoz-org-tag stoz-tag-kennis-warn');
    tag.title = 'Evaluatieroute-projecten vereisen een kennisinstituut per subsidieregeling. Mogelijk ontbreekt informatie.';
    tag.innerHTML = `⚠ Evaluatieroute (${d.eval}×) — kennisinstituut niet gedetecteerd`;
    wrap.appendChild(tag);
  } else {
    // Geen data
    const tag = e('span','stoz-org-tag stoz-tag-kennis-empty');
    tag.title = 'Geen kennisinstituut-participatie gedetecteerd in de beschikbare RVO-data. Bij de Evaluatieroute is dit verplicht.';
    tag.innerHTML = '🎓 Kennisinstituut — niet bekend';
    tag.style.cursor = 'help';
    wrap.appendChild(tag);
  }
  return wrap;
}


function buildZonmwBand(proc, zm){
  const wrap = e('div','band');

  const lbl = e('div','band-label');
  lbl.innerHTML = `<span class="band-tag" style="background:var(--dz-purple-pale);color:var(--dz-purple)">ZonMw VVH</span> ${zm.title}`;
  wrap.appendChild(lbl);

  const meta = e('div','zm-meta', zm.meta);
  wrap.appendChild(meta);

  // Timeline
  const nuPct = zmNuPct(zm.tlStart, zm.tlEnd);
  const tlWrap = e('div','tl-wrap');
  const bar = e('div','tl-bar');
  zm.segs.forEach(seg => {
    const s = e('div','tl-seg');
    s.style.width = seg.w + '%';
    s.style.background = seg.c;
    s.style.color = seg.tc;
    s.textContent = seg.w >= 12 ? seg.l : '';
    s.title = seg.l;
    bar.appendChild(s);
  });
  const nu = e('div','tl-nu');
  nu.style.left = nuPct + '%';
  tlWrap.appendChild(bar);
  tlWrap.appendChild(nu);

  const axis = e('div','tl-axis');
  zm.axis.forEach(t => {
    const tick = e('div','tl-tick'+(t.r?' right':''), t.l);
    tick.style.left = t.p+'%';
    axis.appendChild(tick);
  });
  tlWrap.appendChild(axis);
  wrap.appendChild(tlWrap);

  // Orgs row
  const orgsRow = e('div','zm-orgs-row');

  if(zm.aanvragers && zm.aanvragers.length){
    const g = e('div','zm-org-group');
    g.appendChild(e('div','zm-org-group-label','Aanvragers'));
    zm.aanvragers.forEach(a => {
      const tag = e('span','org-tag');
      tag.textContent = a.l;
      tag.onclick = ()=>openContactDrawer(a.k);
      g.appendChild(tag);
    });
    orgsRow.appendChild(g);
  }

  if(zm.zorgaan && zm.zorgaan.length){
    const g = e('div','zm-org-group');
    g.appendChild(e('div','zm-org-group-label','Zorgaanbieders'));
    zm.zorgaan.forEach(a => {
      const tag = e('span','org-tag');
      tag.textContent = a.l;
      tag.onclick = ()=>openContactDrawer(a.k);
      g.appendChild(tag);
    });
    orgsRow.appendChild(g);
  }

  if(zm.vouchers && zm.vouchers.length){
    const g = e('div','zm-org-group');
    g.appendChild(e('div','zm-org-group-label','ZonMw Implementatie en Opschalingsvouchers (IOC)'));
    zm.vouchers.forEach(v => {
      const tag = e('span','voucher-tag');
      tag.innerHTML = `🏷️ ${v.l}`;
      tag.onclick = ()=>openContactDrawer(v.k);
      g.appendChild(tag);
    });
    orgsRow.appendChild(g);
  }

  wrap.appendChild(orgsRow);

  // STOZ cross-ref: show STOZ orgs for this process if STOZ data exists
  if(proc.stoz && STOZ_ROUTE_DATA[proc.stoz]){
    const d = STOZ_ROUTE_DATA[proc.stoz];
    const xref = e('div','stoz-cross-ref');
    xref.innerHTML = `<div class="v-lbl">Zorgorganisaties met STOZ-subsidie voor dit proces</div>`;
    const total = d.total || (d.impl + d.opsch + d.eval);
    const routeMap = [
      {key:'impl', count:d.impl,  cls:'route-impl',  label:'Impl.'},
      {key:'opsch',count:d.opsch, cls:'route-opsch', label:'Opsch.'},
      {key:'eval', count:d.eval,  cls:'route-eval',  label:'Eval. ✶'},
    ];
    routeMap.filter(r=>r.count>0).forEach(r=>{
      const pill = e('span','stoz-org-pill');
      pill.innerHTML = `<span class="stoz-badge">STOZ</span>${r.count} instellingen <span class="route-indicator-mini ${r.cls}">${r.label}</span>`;
      pill.onclick = ()=>openStozDrawer(proc);
      xref.appendChild(pill);
    });
    wrap.appendChild(xref);
  }

  return wrap;
}

function buildCard(procIdx){
  const proc = DIGIZO_PROCESSEN[procIdx];

  // Speciale weergave voor de STOZ-infokaart
  if(proc._infokaart){
    return buildStozInfoKaart(proc);
  }
  const card = e('div','card');
  card.dataset.procIdx = procIdx;

  // Header
  const head = e('div','card-head');
  const headLeft = e('div','card-head-left');

  const link = e('a','card-proc-link', proc.naam);
  link.href = `https://digizo.nu/proces/${proc.slug}/`;
  link.target = '_blank';
  headLeft.appendChild(link);

  const pills = e('div','card-pills');
  proc.sectoren.forEach(sec => {
    const c = SEC_COLORS[sec] || {fg:'#888',bg:'#eee'};
    const p = e('span','pill', sec);
    p.style.background = c.bg;
    p.style.color = c.fg;
    pills.appendChild(p);
  });
  headLeft.appendChild(pills);
  head.appendChild(headLeft);

  const badges = e('div','card-badge-row');
  if(hasStoz(proc)){
    const b = e('span','src-badge stoz','STOZ');
    badges.appendChild(b);
  }
  if(hasZonmw(proc)){
    const b = e('span','src-badge zonmw','ZonMw');
    badges.appendChild(b);
  }
  head.appendChild(badges);
  card.appendChild(head);

  // ZonMw band — EERST (meest inhoudelijk relevant voor zorgveld)
  if(proc.zonmw){
    const zm = ZONMW_CARDS[proc.zonmw];
    if(zm){
      card.appendChild(buildZonmwBand(proc, zm));
    } else {
      const band = e('div','band');
      band.innerHTML = `<div class="band-label"><span class="band-tag" style="background:var(--dz-purple-pale);color:var(--dz-purple)">ZonMw VVH</span></div>
        <div class="band-ph">ZonMw-projectdata niet beschikbaar.</div>`;
      card.appendChild(band);
    }
  } else {
    const band = e('div','band');
    band.innerHTML = `<div class="band-label"><span class="band-tag" style="background:var(--dz-purple-pale);color:var(--dz-purple)">ZonMw VVH</span> Geen ZonMw-koppeling</div>
      <div class="band-ph">Er is geen ZonMw Versnellingsimpuls VVH project gekoppeld aan dit Digizo.nu proces.</div>`;
    card.appendChild(band);
  }

  // STOZ band — TWEEDE
  if(proc.stoz){
    const stozBand = buildStozBand(proc);
    card.appendChild(stozBand);
  } else {
    const band = e('div','band');
    band.innerHTML = `<div class="band-label"><span class="band-tag" style="background:#e8e9f0;color:#1b1e4c">STOZ</span> Routekaart</div>
      <div class="band-ph">Dit proces heeft geen STOZ-routedata. Zie <a href="https://digizo.nu/proces/${proc.slug}/" target="_blank" style="color:var(--dz-purple)">digizo.nu</a> voor meer info.</div>`;
    card.appendChild(band);
  }

  // Footer
  const footer = e('div','card-footer');
  footer.innerHTML = `<span class="footer-text">Digizo.nu proces</span>
    <a class="footer-link" href="https://digizo.nu/proces/${proc.slug}/" target="_blank">Bekijk op digizo.nu →</a>
    <span class="footer-text" style="margin-left:auto">${proc.sectoren.join(' · ')}</span>`;
  card.appendChild(footer);

  return card;
}

function openContactDrawer(key){
  const c = CONTACT[key];
  if(!c){ console.warn('No contact data for',key); return; }

  document.getElementById('d-icon').textContent = c.icon || '📋';
  document.getElementById('d-title').textContent = c.title;
  document.getElementById('d-sub').textContent = c.sub || '';

  const body = document.getElementById('d-body');
  body.innerHTML = '';

  // Details section
  if(c.details && c.details.length){
    const sec = e('div','drawer-section');
    sec.appendChild(e('div','drawer-section-title','Details'));
    c.details.forEach(d => {
      const row = e('div','drawer-row');
      row.appendChild(e('div','drawer-row-label',d.l));
      row.appendChild(e('div','drawer-row-val',d.v));
      sec.appendChild(row);
    });
    body.appendChild(sec);
  }

  // Contacts
  if(c.contacts && c.contacts.length){
    const sec = e('div','drawer-section');
    sec.appendChild(e('div','drawer-section-title','Contactpersonen'));
    const list = e('div','drawer-contacts');
    c.contacts.forEach(ct => {
      const card = e('div','contact-card');
      card.appendChild(e('div','contact-name',ct.n));
      if(ct.r) card.appendChild(e('div','contact-role',ct.r));
      const links = e('div','contact-links');
      if(ct.mail){
        const a = e('a','contact-link',`✉ ${ct.mail}`);
        a.href = `mailto:${ct.mail}`;
        links.appendChild(a);
      }
      if(ct.li){
        const a = e('a','contact-link','in LinkedIn');
        a.href = ct.li;
        a.target = '_blank';
        links.appendChild(a);
      }
      if(ct.web){
        const a = e('a','contact-link','🌐 '+ct.web);
        a.href = 'https://'+ct.web;
        a.target = '_blank';
        links.appendChild(a);
      }
      if(links.children.length) card.appendChild(links);
      list.appendChild(card);
    });
    sec.appendChild(list);
    body.appendChild(sec);
  }

  // Kennis
  const ken = e('div','drawer-kennis');
  ken.innerHTML = `<div class="drawer-kennis-title">Over deze organisatie</div>
    <div class="drawer-kennis-text">${c.sub || c.title}. Onderdeel van het ZonMw Versnellingsimpuls VVH programma.</div>`;
  body.appendChild(ken);

  // Buttons
  const a1 = e('a','drawer-btn primary','Bekijk op ZonMw →');
  a1.href = 'https://zonmw.nl/versnellingsimpuls';
  a1.target = '_blank';
  body.appendChild(a1);

  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

  const vd = STOZ_VWS_DATA[proc.stoz] || STOZ_VWS_DATA[proc.naam] || null;
  document.getElementById('d-icon').textContent = '📊';
  document.getElementById('d-title').textContent = proc.stoz || proc.naam;
  document.getElementById('d-sub').textContent = `STOZ Routekaart · ${(proc.sectoren||[]).join(', ')}`;

  const body = document.getElementById('d-body');
  body.innerHTML = '';

  // ── Aanvrager detail (als geklikt op een org-tag) ──────────────────
  if(aanvr){
    const asecTop = e('div','drawer-section');
    const routeLabelMap = {
      'eval':  'Evaluatieroute-aanvrager ✶',
      'opsch': 'Opschalingsroute-aanvrager',
      'impl':  'Implementatiestart & Strategievorming-aanvrager',
    };
    const routeBadgeMap = {
      'eval':  'Evaluatieroute ✶',
      'opsch': 'Opschalingsroute',
      'impl':  'Implementatiestart & Strategievorming',
    };
    const routeTitle = routeLabelMap[aanvr.r] || 'STOZ-aanvrager';
    asecTop.appendChild(e('div','drawer-section-title', routeTitle));

    // Route-badge prominent
    const badge = e('div','drawer-aanvr-header');
    badge.innerHTML = `<span class="drawer-aanvr-naam">${aanvr.a}</span>
      <span class="drawer-route-badge drawer-route-${aanvr.r}">${routeBadgeMap[aanvr.r] || aanvr.r}</span>`;
    asecTop.appendChild(badge);

    // Kennispartner
    const kennisRow = e('div','drawer-row');
    kennisRow.appendChild(e('div','drawer-row-label','Kennispartner'));
    const kennisVal = e('div','drawer-row-val');
    if(aanvr.k){
      kennisVal.innerHTML = `<span class="drawer-kennis-badge">🎓 ${aanvr.k}</span>`;
    } else {
      kennisVal.textContent = aanvr.r === 'eval'
        ? '⚠ Niet gedetecteerd — bij evaluatieroute verplicht'
        : 'Niet van toepassing (optioneel bij opschalingsroute)';
    }
    kennisRow.appendChild(kennisVal);
    asecTop.appendChild(kennisRow);

    // Technologieën van DEZE aanvrager — zelfde stijl als kaart
    if(aanvr.l && aanvr.l.length){
      const techRow = e('div','drawer-row');
      techRow.appendChild(e('div','drawer-row-label','Technologieën'));
      const techVal = e('div','drawer-row-val stoz-lev-row');
      aanvr.l.forEach(t => {
        const pill = e('span','stoz-lev-pill');
        pill.innerHTML = `<span class="stoz-lev-badge">TECH</span>${t}`;
        techVal.appendChild(pill);
      });
      techRow.appendChild(techVal);
      asecTop.appendChild(techRow);
    }

    body.appendChild(asecTop);
  }

  // ── Alle aanvragers voor dit proces (als geen specifieke aanvrager) ──
  if(vd && vd.aanvragers && vd.aanvragers.length && !aanvr){
    const asec = e('div','drawer-section');
    asec.appendChild(e('div','drawer-section-title','Goedgekeurde aanvragers RVO 2024/2025'));

    const implAanvr2  = vd.aanvragers.filter(a => a.r === 'impl');
    const opschAanvr2 = vd.aanvragers.filter(a => a.r === 'opsch');
    const evalAanvr2  = vd.aanvragers.filter(a => a.r === 'eval');

    function makeDrawerGrp(label, aanvrs, tagClass){
      if(!aanvrs.length) return;
      const grp = e('div','zm-org-group');
      grp.appendChild(e('div','zm-org-group-label', label));
      const tagWrap = e('div','org-tags');
      aanvrs.forEach(a => {
        const tag = e('span','org-tag ' + tagClass);
        tag.innerHTML = a.a + (a.k ? ` <span style="font-size:10px">🎓</span>` : '');
        tag.title = (a.k ? `Kennispartner: ${a.k}` : '') + (a.l&&a.l.length ? `
Tech: ${a.l.join(', ')}` : '');
        tag.onclick = () => openStozDrawer(proc, a);
        tagWrap.appendChild(tag);
      });
      grp.appendChild(tagWrap);
      asec.appendChild(grp);
    }
    makeDrawerGrp('Implementatiestart & Strategievorming', implAanvr2,  'stoz-tag-impl');
    makeDrawerGrp('Opschalingsroute',                       opschAanvr2, 'stoz-tag-opsch-main');
    makeDrawerGrp('Evaluatieroute ✶',                       evalAanvr2,  'stoz-tag-eval-main');
    body.appendChild(asec);
  }

  // ── Technologieën voor dit proces ────────────────────────────────────
  if(vd && vd.leveranciers && vd.leveranciers.length && !aanvr){
    const tsec = e('div','drawer-section');
    tsec.appendChild(e('div','drawer-section-title','Technologieën in goedgekeurde projecten'));
    const techRow = e('div','stoz-lev-row');  // zelfde klasse als op kaart
    vd.leveranciers.forEach(t => {
      const pill = e('span','stoz-lev-pill');
      pill.innerHTML = `<span class="stoz-lev-badge">TECH</span>${t}`;
      techRow.appendChild(pill);
    });
    tsec.appendChild(techRow);
    body.appendChild(tsec);
  }


  // ── Route-info: verwijzing naar DigiDex-infokaart ────────────────────
  const infoRef = e('div','drawer-info-ref');
  infoRef.innerHTML = `<span class="drawer-info-icon">ℹ</span>
    Route-aantallen en subsidie-uitleg staan op de
    <a href="#" class="drawer-info-link" onclick="event.preventDefault();showInfoKaart()">STOZ-infokaart ↗</a>`;
  body.appendChild(infoRef);

    const a1 = e('a','drawer-btn secondary','Bekijk op digizo.nu →');
  a1.href = `https://digizo.nu/proces/${proc.slug}/`;
  a1.target = '_blank';
  body.appendChild(a1);

  const a2 = e('a','drawer-btn secondary','STOZ informatie (RVO) →');
  a2.href = 'https://www.rvo.nl/subsidies-financiering/stoz';
  a2.target = '_blank';
  body.appendChild(a2);

  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer(){
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

// ─────────────────────────────────────────────
// NAVIGATION & FILTERING
// ─────────────────────────────────────────────
function computeFiltered(){
  filteredIndices = DIGIZO_PROCESSEN
    .map((_,i)=>i)
    .filter(i => bronMatch(DIGIZO_PROCESSEN[i], currentBron) && sectorMatch(DIGIZO_PROCESSEN[i], currentSector));
}

function showCard(pos){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('visible'));
  const pips = document.querySelectorAll('.pip');
  pips.forEach((p,i)=>p.classList.toggle('active', i===pos));

  if(filteredIndices.length === 0){
    document.getElementById('nav-counter').textContent = '0 / 0';
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = true;
    return;
  }

  currentIdx = Math.max(0, Math.min(pos, filteredIndices.length-1));
  const procIdx = filteredIndices[currentIdx];
  const card = document.querySelector(`.card[data-proc-idx="${procIdx}"]`);
  if(card) card.classList.add('visible');

  document.getElementById('nav-counter').textContent = `${currentIdx+1} / ${filteredIndices.length}`;
  document.getElementById('btn-prev').disabled = currentIdx === 0;
  document.getElementById('btn-next').disabled = currentIdx === filteredIndices.length-1;

  closeDrawer();
}

function buildPips(){
  const pipsEl = document.getElementById('pips');
  pipsEl.innerHTML = '';
  filteredIndices.forEach((procIdx, pos) => {
    const pip = e('div','pip');
    const proc = DIGIZO_PROCESSEN[procIdx];
    pip.title = proc.naam;
    pip.onclick = ()=>showCard(pos);
    pipsEl.appendChild(pip);
  });
}

function navigate(dir){
  showCard(currentIdx + dir);
}

function showInfoKaart(){
  // Navigeer naar de STOZ-infokaart (aparte kaart in de machine)
  const infoIdx = DIGIZO_PROCESSEN.findIndex(p => p._infokaart === true);
  if(infoIdx > -1){
    showCard(infoIdx);
  } else {
    // Fallback: open RVO-pagina
    window.open('https://www.rvo.nl/subsidies-financiering/stoz/aanvraagproces','_blank');
  }
}

function filterBron(bron){
  currentBron = bron;
  document.querySelectorAll('.src-btn').forEach(b=>b.classList.remove('active'));
  const map = {all:0, stoz:1, zonmw:2, both:3};
  document.querySelectorAll('.src-btn')[map[bron]].classList.add('active');
  currentIdx = 0;
  computeFiltered();
  buildPips();
  showCard(0);
  buildSectorTabs(); // rebuild tabs with updated counts
}

function filterSector(sec){
  currentSector = sec;
  currentIdx = 0;
  computeFiltered();
  buildPips();
  showCard(0);
  buildSectorTabs();
}

// ─────────────────────────────────────────────
// SECTOR TABS
// ─────────────────────────────────────────────
const ALL_SECTORS = ['VVT','GGZ','HA','HAP','MSZ','SD'];

function buildSectorTabs(){
  const container = document.getElementById('sector-tabs');
  container.innerHTML = '';

  const allCount = DIGIZO_PROCESSEN.filter(p=>bronMatch(p,currentBron)).length;
  const allTab = e('button','sec-tab'+(currentSector==='all'?' active':''));
  allTab.innerHTML = `Alle <span class="tab-count">${allCount}</span>`;
  if(currentSector==='all') allTab.style.background='var(--dz-navy)';
  allTab.onclick = ()=>filterSector('all');
  container.appendChild(allTab);

  ALL_SECTORS.forEach(sec=>{
    const count = DIGIZO_PROCESSEN.filter(p=>p.sectoren.includes(sec) && bronMatch(p,currentBron)).length;
    const c = SEC_COLORS[sec];
    const tab = e('button','sec-tab'+(currentSector===sec?' active':''));
    tab.innerHTML = `${sec} <span class="tab-count">${count}</span>`;
    if(currentSector===sec){
      tab.style.background = c.fg;
      tab.style.borderColor = c.fg;
    }
    tab.onclick = ()=>filterSector(sec);
    container.appendChild(tab);
  });
}

// ─────────────────────────────────────────────
// SOURCE COUNTS
// ─────────────────────────────────────────────
function updateSourceCounts(){
  const all = DIGIZO_PROCESSEN.length;
  const stoz = DIGIZO_PROCESSEN.filter(p=>hasStoz(p)).length;
  const zonmw = DIGIZO_PROCESSEN.filter(p=>hasZonmw(p)).length;
  const both = DIGIZO_PROCESSEN.filter(p=>hasStoz(p)&&hasZonmw(p)).length;
  document.getElementById('cnt-all').textContent = all;
  document.getElementById('cnt-stoz').textContent = stoz;
  document.getElementById('cnt-zonmw').textContent = zonmw;
  document.getElementById('cnt-both').textContent = both;
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init(){
  // Build all cards into slot
  const slot = document.getElementById('card-slot');
  DIGIZO_PROCESSEN.forEach((_,i)=>{
    slot.appendChild(buildCard(i));
  });

  updateSourceCounts();
  computeFiltered();
  buildPips();
  buildSectorTabs();
  showCard(0);
}

init();
</script>
</body>
</html>
