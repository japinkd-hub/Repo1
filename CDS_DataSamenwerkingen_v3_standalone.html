<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">

<title>CDS Data Samenwerkingen</title>
<style>/* system fonts fallback */ body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }</style>
<style>
:root {
  --navy:#1b1e4c; --paars:#7a00df; --teal:#5ad1c4;
  --bg:#f4f6fb; --border:#e2e6f0; --text:#1a1d3a; --muted:#6b7194;
  --pw:420px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}

/* HEADER */
header{background:var(--navy);color:#fff;padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 2px 12px rgba(0,0,0,.2);z-index:10}
.hbadge{background:var(--paars);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;padding:3px 8px;border-radius:4px;margin-right:12px}
.htitle{font-size:16px;font-weight:600}
.legend{display:flex;gap:10px;align-items:center}
.leg{display:flex;align-items:center;gap:5px;font-size:11px;color:rgba(255,255,255,.8);padding:3px 8px;border-radius:20px}
.ldot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* FILTER BAR */
.filterbar{background:#fff;border-bottom:2px solid var(--border);padding:7px 24px;display:flex;gap:8px;align-items:center;flex-shrink:0;flex-wrap:wrap}
.fb-label{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-right:4px;white-space:nowrap;flex-shrink:0}
.fb-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 13px;border-radius:20px;font-size:12px;font-weight:600;cursor:pointer;border:1.5px solid var(--uc-color,#aaa);background:#fff;color:var(--uc-color,#666);transition:all .15s ease;white-space:nowrap;line-height:1.2}
.fb-btn:hover{background:var(--uc-bg,#f0f0f0)}
.fb-btn.active{background:var(--uc-color,#aaa);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.fb-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex-shrink:0}
.fb-sep{width:1px;height:22px;background:var(--border);margin:0 2px;flex-shrink:0}
.fb-reset{font-size:11px;font-weight:500;color:var(--muted);background:none;border:1px solid var(--border);cursor:pointer;padding:4px 10px;border-radius:20px;transition:all .12s;white-space:nowrap}
.fb-reset:hover{background:var(--bg);color:var(--text);border-color:var(--muted)}
.fb-hint{font-size:11px;color:var(--muted);font-style:italic;margin-left:6px}

/* STATS */
.statsbar{background:#fff;border-bottom:1px solid var(--border);padding:8px 24px;display:flex;gap:24px;align-items:center;flex-shrink:0}
.snum{font-size:18px;font-weight:700;color:var(--navy)}
.slbl{font-size:10px;color:var(--muted)}
.sdiv{width:1px;height:28px;background:var(--border)}

/* MAIN */
.main{flex:1;display:flex;overflow:hidden;position:relative;min-height:0}
.maparea{flex:1;overflow:hidden;position:relative;transition:margin-right .3s ease;min-height:0;display:flex;flex-direction:column}
.maparea.open{margin-right:var(--pw)}
#map{flex:1;width:100%;position:relative;overflow:hidden}
#map svg{width:100%;height:100%}

.region{stroke:#fff;stroke-width:.7px;cursor:pointer;transition:fill .25s ease,opacity .12s,stroke-width .12s}
.region:hover{stroke:#1b1e4c;stroke-width:1.8px;opacity:.82}
.region.sel{stroke:#1b1e4c;stroke-width:2.2px}

/* TOOLTIP */
.tip{position:absolute;background:var(--navy);color:#fff;padding:8px 12px;border-radius:6px;font-size:12px;pointer-events:none;opacity:0;transition:opacity .1s;box-shadow:0 4px 16px rgba(0,0,0,.25);z-index:200;max-width:240px}
.tip.show{opacity:1}
.tn{font-weight:600;margin-bottom:2px}
.ts{font-size:11px;opacity:.75}
.tp{font-size:11px;color:var(--teal);margin-top:2px}
.tuc-row{display:flex;align-items:center;gap:5px;font-size:11px;margin-top:3px;padding-top:3px;border-top:1px solid rgba(255,255,255,.15)}
.tuc-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* MAP LEGEND OVERLAY */
.map-ov{position:absolute;bottom:16px;left:16px;background:rgba(27,30,76,.85);backdrop-filter:blur(4px);color:#fff;border-radius:8px;padding:10px 14px;font-size:11px;z-index:50;display:none;min-width:160px}
.map-ov.show{display:block}
.mov-title{font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:rgba(255,255,255,.55);margin-bottom:7px}
.mov-item{display:flex;align-items:center;gap:7px;margin-bottom:5px;line-height:1.2}
.mov-item:last-child{margin-bottom:0}
.mov-dot{width:11px;height:11px;border-radius:50%;flex-shrink:0}

/* PANEL */
.panel{position:absolute;top:0;right:0;width:var(--pw);height:100%;background:#fff;border-left:1px solid var(--border);box-shadow:-4px 0 20px rgba(0,0,0,.1);transform:translateX(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;z-index:100;overflow:hidden}
.panel.open{transform:translateX(0)}
.ph{background:var(--navy);color:#fff;padding:16px 18px 14px;flex-shrink:0}
.ph-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.pnr{font-size:10px;color:var(--teal);font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:3px}
.ptitle{font-size:15px;font-weight:700;line-height:1.2}
.pclose{background:rgba(255,255,255,.12);border:none;color:#fff;width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .12s;flex-shrink:0}
.pclose:hover{background:rgba(255,255,255,.22)}
.pbadge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;margin-top:6px}
.bdot{width:7px;height:7px;border-radius:50%}
.pvz{display:flex;gap:5px;margin-top:8px;flex-wrap:wrap}
.vtag{background:rgba(90,209,196,.15);color:var(--teal);border:1px solid rgba(90,209,196,.3);border-radius:20px;padding:2px 8px;font-size:11px;font-weight:500}

/* PANEL BODY */
.pb{flex:1;overflow-y:auto;padding:0}
.acc-sec{border-bottom:1px solid var(--border)}
.acc-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;cursor:pointer;user-select:none;transition:background .1s}
.acc-hdr:hover{background:var(--bg)}
.acc-left{display:flex;align-items:center;gap:10px}
.acc-icon{width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0}
.acc-ttl{font-size:12.5px;font-weight:600}
.acc-arr{font-size:10px;color:var(--muted);transition:transform .18s}
.acc-arr.open{transform:rotate(180deg)}
.acc-body{overflow:hidden;max-height:0;transition:max-height .25s ease}
.acc-body.open{max-height:600px}
.acc-inner{padding:4px 18px 14px}
.frow{margin-bottom:10px}
.flbl{font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px}
.fval{font-size:12.5px;color:var(--text);line-height:1.4}
.fval.empty{color:var(--muted);font-style:italic}
.schip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600}
.scd{width:6px;height:6px;border-radius:50%}

/* USE CASE GRID */
.ucgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ucitem{border-radius:8px;padding:10px;border:1px solid var(--border)}
.uclbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px}
.ucval{font-size:12px;font-weight:600;color:var(--text)}
.ucval.ntb{color:var(--muted);font-style:italic;font-weight:400}
.ucval.empty-val{color:#ccc;font-style:italic;font-weight:400}

/* FEATURED USE CASES (filter active) */
.uc-feat-section{padding:14px 18px 4px;border-bottom:1px solid var(--border)}
.uc-feat-title{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.uc-feat-item{border-radius:8px;padding:10px 14px;margin-bottom:10px;border-left:4px solid var(--uc-feat-c)}
.uc-feat-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--uc-feat-c);margin-bottom:4px}
.uc-feat-val{font-size:13px;font-weight:600;color:var(--text)}
.uc-feat-val.ntb{color:var(--muted);font-style:italic;font-weight:400}
.uc-feat-val.empty{color:#bbb;font-style:italic;font-weight:400}

/* WARN / CONTACT */
.warn{background:#fef9e7;border:1px solid #f39c12;border-radius:6px;padding:8px 10px;font-size:11px;color:#856404;display:flex;gap:6px;align-items:flex-start}
.cblock{background:var(--bg);border-radius:8px;padding:10px 12px}
.cname{font-size:13px;font-weight:600;margin-bottom:2px}
.cemail{font-size:12px;color:var(--paars);word-break:break-all}

/* EMPTY STATE */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;gap:8px}
.ei{font-size:32px}
.et{font-size:13px;color:var(--muted);text-align:center}
</style>
</head>

const byRegio = {};
DATA.forEach(function(d){ byRegio[d.regio] = d; });

let activeUCs = new Set();
let currentRow = null;
var panelOpen = false;
const panel = document.getElementById('panel');
const maparea = document.getElementById('maparea');

/* ---------- USE CASE FILTER ---------- */
function toggleUC(uc) {
  if (activeUCs.has(uc)) { activeUCs.delete(uc); }
  else { activeUCs.add(uc); }
  updateFilterUI();
  updateMapColors();
  if (currentRow && panelOpen) {
    document.getElementById('pb').innerHTML = buildBody(currentRow);
    initAccordions();
  }
}

function resetUCFilter() {
  activeUCs.clear();
  updateFilterUI();
  updateMapColors();
  if (currentRow && panelOpen) {
    document.getElementById('pb').innerHTML = buildBody(currentRow);
    initAccordions();
  }
}

function updateFilterUI() {
  document.querySelectorAll('.fb-btn').forEach(function(btn) {
    btn.classList.toggle('active', activeUCs.has(btn.getAttribute('data-uc')));
  });
  var hint = document.getElementById('fbHint');
  var ov = document.getElementById('mapOv');
  var ucArr = Array.from(activeUCs);
  if (ucArr.length === 1) {
    var cfg = UCCFG[ucArr[0]];
    hint.textContent = 'Kaart toont adoptie van ' + cfg.label;
    document.getElementById('movTitle').textContent = cfg.label;
    document.getElementById('movDotFilled').style.background = cfg.color;
    ov.classList.add('show');
  } else {
    hint.textContent = ucArr.length > 1 ? 'Kaart toont initiatiefstatus' : '';
    ov.classList.remove('show');
  }
}

function ucVal(row, uc) {
  return row ? (row[UCCFG[uc].key] || '') : '';
}

function isUCFilled(val) {
  return val && val.trim() !== '' && val.toLowerCase() !== 'n.t.b.';
}

/* ---------- MAP COLORS ---------- */
function getStatusColor(sn) {
  var rn = resolve(sn);
  var d = byRegio[rn];
  var s = d ? d.status : 'Onbekend';
  return (STATUSCFG[s] || {c:'#ccd0e0'}).c;
}

function getUCColor(sn, uc) {
  var rn = resolve(sn);
  var row = byRegio[rn];
  if (!row) return '#c8cfe0';
  var val = row[UCCFG[uc].key] || '';
  if (val === '') return '#c8cfe0';
  if (val.toLowerCase() === 'n.t.b.') return '#f0c800';
  return UCCFG[uc].color;
}

function getColor(sn) {
  var ucArr = Array.from(activeUCs);
  if (ucArr.length === 1) return getUCColor(sn, ucArr[0]);
  return getStatusColor(sn);
}

function updateMapColors() {
  document.querySelectorAll('.region').forEach(function(el) {
    el.setAttribute('fill', getColor(el.getAttribute('data-sn')));
  });
}

/* ---------- STATS / LEGEND ---------- */
function renderStats() {
  var cnt = {};
  DATA.forEach(function(d){ cnt[d.status] = (cnt[d.status]||0)+1; });
  var h = '<div style="display:flex;align-items:center;gap:6px"><div class="snum">'
    + DATA.length + '</div><div class="slbl">IZA<br>regio's</div></div><div class="sdiv"></div>';
  Object.entries(STATUSCFG).forEach(function([k,v]) {
    if (cnt[k]) h += '<div style="display:flex;align-items:center;gap:6px">'
      + '<div style="width:9px;height:9px;border-radius:50%;background:'+v.c+'"></div>'
      + '<div><div class="snum" style="color:'+v.c+';font-size:15px">'+cnt[k]+'</div>'
      + '<div class="slbl">'+k+'</div></div></div>';
  });
  document.getElementById('statsbar').innerHTML = h;
}

function renderLegend() {
  var h = '';
  Object.entries(STATUSCFG).forEach(function([k,v]) {
    h += '<div class="leg"><div class="ldot" style="background:'+v.c+'"></div>'+k+'</div>';
  });
  document.getElementById('legend').innerHTML = h;
}

/* ---------- PANEL ---------- */
function closePanel() {
  panel.classList.remove('open');
  maparea.classList.remove('open');
  document.querySelectorAll('.region').forEach(function(p){ p.classList.remove('sel'); });
  panelOpen = false;
  currentRow = null;
}
document.getElementById('pclose').onclick = closePanel;

var resolve = function(sn) {
  if (NMAP[sn]) return NMAP[sn];
  if (byRegio[sn]) return sn;
  return null;
};

function openPanel(sn) {
  var rn = resolve(sn) || sn;
  var row = byRegio[rn];
  currentRow = row;

  document.getElementById('pnr').textContent = row ? 'Regio nr. ' + row.nr : '';
  document.getElementById('ptitle').textContent = rn;

  var status = row ? row.status : 'Onbekend';
  var sc = STATUSCFG[status] || {c:'#ccc',l:'#eee'};
  document.getElementById('pbadge').innerHTML =
    '<div class="pbadge" style="background:'+sc.l+';color:'+sc.c+'">'
    +'<div class="bdot" style="background:'+sc.c+'"></div>'+status+'</div>';

  var vzh = '';
  if (row && row.vz1) vzh += '<span class="vtag">'+row.vz1+'</span>';
  if (row && row.vz2) vzh += '<span class="vtag">'+row.vz2+'</span>';
  document.getElementById('pvz').innerHTML = vzh;

  document.getElementById('pb').innerHTML = row
    ? buildBody(row)
    : '<div class="empty-state"><div class="ei">&#x2753;</div><div class="et">Geen data beschikbaar voor deze regio</div></div>';

  panel.classList.add('open');
  maparea.classList.add('open');
  panelOpen = true;
  initAccordions();
}

function initAccordions() {
  document.querySelectorAll('.acc-hdr').forEach(function(h) {
    h.onclick = function() {
      var b = h.nextElementSibling;
      var a = h.querySelector('.acc-arr');
      b.classList.toggle('open');
      a.classList.toggle('open');
    };
  });
  var first = document.querySelector('.acc-body');
  if (first) {
    first.classList.add('open');
    var arr = document.querySelector('.acc-arr');
    if (arr) arr.classList.add('open');
  }
}

function chip(status) {
  var sc = STATUSCFG[status] || {c:'#aaa',l:'#eee'};
  return '<span class="schip" style="background:'+sc.l+';color:'+sc.c+'">'
    +'<span class="scd" style="background:'+sc.c+'"></span>'+(status||'—')+'</span>';
}

function buildBody(r) {
  var platform = r.platform || '';
  var hasContact = r.contact || r.email || r.eigenaar;
  var hasAp = r.ap && r.ap.trim();
  var ucArr = Array.from(activeUCs);
  var hasFilter = ucArr.length > 0;

  /* ---- Use case section ---- */
  var ucSection = '';
  if (hasFilter) {
    /* Featured: show only selected use cases */
    var items = ucArr.map(function(uc) {
      var cfg = UCCFG[uc];
      var val = r[cfg.key] || '';
      var valClass = val === '' ? 'empty' : (val.toLowerCase() === 'n.t.b.' ? 'ntb' : '');
      var valText = val === '' ? '— niet ingevuld' : (val.toLowerCase() === 'n.t.b.' ? 'Nader te bepalen' : val);
      return '<div class="uc-feat-item" style="--uc-feat-c:'+cfg.color+';background:'+cfg.bg+'">'
        +'<div class="uc-feat-lbl">'+cfg.label+'</div>'
        +'<div class="uc-feat-val '+valClass+'">'+valText+'</div>'
        +'</div>';
    }).join('');
    ucSection = '<div class="uc-feat-section">'
      +'<div class="uc-feat-title">&#x1F517; Geselecteerde use cases</div>'
      + items
      +'</div>';
  } else {
    /* Grid: show all use cases */
    var ntb = function(v){ return (v==='n.t.b.'||v==='')?'<div class="ucval '+(v===''?'empty-val':'ntb')+'">'+(v||'—')+'</div>':'<div class="ucval">'+v+'</div>'; };
    ucSection = '<div class="acc-sec">'
      +'<div class="acc-hdr">'
      +'<div class="acc-left"><div class="acc-icon" style="background:#e8f8ef">&#x1F517;</div>'
      +'<div class="acc-ttl">Use cases</div></div>'
      +'<div class="acc-arr">&#9660;</div></div>'
      +'<div class="acc-body"><div class="acc-inner">'
      +'<div class="ucgrid">'
      +'<div class="ucitem" style="border-color:#d0e8f8"><div class="uclbl" style="color:#2980b9">PZP</div>'+ntb(r.pzp)+'</div>'
      +'<div class="ucitem" style="border-color:#c0ece4"><div class="uclbl" style="color:#16a085">Zorgcoördinatie</div>'+ntb(r.zorgco)+'</div>'
      +'<div class="ucitem" style="border-color:#f5d8c8"><div class="uclbl" style="color:#d35400">360° viewer</div>'+ntb(r.viewer)+'</div>'
      +'<div class="ucitem" style="border-color:#e2d5f0"><div class="uclbl" style="color:#8e44ad">Overige use case</div>'+ntb(r.overig)+'</div>'
      +'</div>'
      +'</div></div></div>';
  }

  return (hasAp ? '<div style="padding:10px 18px 0"><div class="warn">&#x26A0;&#xFE0F; <span>'+r.ap+'</span></div></div>' : '')
    +'<div class="acc-sec">'
    +'<div class="acc-hdr">'
    +'<div class="acc-left"><div class="acc-icon" style="background:#e8f4fd">&#x1F4E1;</div>'
    +'<div class="acc-ttl">Dataplatform &amp; initiatief</div></div>'
    +'<div class="acc-arr">&#9660;</div></div>'
    +'<div class="acc-body"><div class="acc-inner">'
    +'<div class="frow"><div class="flbl">Platform / initiatief</div>'+(platform?'<div class="fval">'+platform+'</div>':'<div class="fval empty">Niet ingevuld</div>')+'</div>'
    +'<div class="frow"><div class="flbl">Status initiatief</div>'+chip(r.status)+'</div>'
    +'</div></div></div>'
    + ucSection
    +'<div class="acc-sec">'
    +'<div class="acc-hdr">'
    +'<div class="acc-left"><div class="acc-icon" style="background:#f5eef8">&#x1F512;</div>'
    +'<div class="acc-ttl">Technische bouwstenen</div></div>'
    +'<div class="acc-arr">&#9660;</div></div>'
    +'<div class="acc-body"><div class="acc-inner">'
    +'<div class="frow"><div class="flbl">Identificatie &amp; authenticatie</div><div class="fval empty">Niet ingevuld</div></div>'
    +'<div class="frow"><div class="flbl">Toestemming</div><div class="fval empty">Niet ingevuld</div></div>'
    +'<div class="frow"><div class="flbl">Lokalisatie</div><div class="fval empty">Niet ingevuld</div></div>'
    +'<div class="frow"><div class="flbl">Adressering</div><div class="fval empty">Niet ingevuld</div></div>'
    +'<div class="frow"><div class="flbl">Logging</div><div class="fval empty">Niet ingevuld</div></div>'
    +'</div></div></div>'
    +(hasContact ? '<div class="acc-sec">'
    +'<div class="acc-hdr">'
    +'<div class="acc-left"><div class="acc-icon" style="background:#fef9e7">&#x1F464;</div>'
    +'<div class="acc-ttl">Contactpersoon</div></div>'
    +'<div class="acc-arr">&#9660;</div></div>'
    +'<div class="acc-body"><div class="acc-inner">'
    +'<div class="cblock">'
    +(r.eigenaar?'<div class="frow"><div class="flbl">Eigenaar</div><div class="fval">'+r.eigenaar+'</div></div>':'')
    +(r.contact?'<div class="cname">'+r.contact+'</div>':'')
    +(r.email?'<div class="cemail">'+r.email+'</div>':'')
    +'</div></div></div></div>' : '');
}

function initMap() {
  var cont = document.getElementById('map');
  var W = 760, H = 680;
  var ns = 'http://www.w3.org/2000/svg';
  var svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', '100%');
  svg.setAttribute('height', '100%');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  cont.appendChild(svg);
  var tip = document.getElementById('tip');

  GEO.forEach(function(feat) {
    var sn = feat.n;
    var el = document.createElementNS(ns, 'path');
    el.setAttribute('class', 'region');
    el.setAttribute('data-sn', sn);
    el.setAttribute('d', feat.d);
    el.setAttribute('fill', getColor(sn));

    el.addEventListener('mousemove', function(ev) {
      var rn = resolve(sn) || sn;
      var row = byRegio[rn];
      var s = row ? row.status : 'Onbekend';
      var sc = STATUSCFG[s] || {c:'#aaa'};
      var ucArr = Array.from(activeUCs);
      var ucHtml = '';
      if (ucArr.length > 0) {
        ucHtml = ucArr.map(function(uc) {
          var cfg = UCCFG[uc];
          var val = row ? (row[cfg.key] || '—') : '—';
          return '<div class="tuc-row"><div class="tuc-dot" style="background:'+cfg.color+'"></div>'
            +'<span style="color:rgba(255,255,255,.6)">'+cfg.label+':</span>&nbsp;'
            +'<span>'+val+'</span></div>';
        }).join('');
      }
      tip.innerHTML = '<div class="tn">'+rn+'</div>'
        + '<div class="ts" style="color:'+sc.c+'">'+s+'</div>'
        + (row && row.platform && ucArr.length===0 ? '<div class="tp">&#x1F4E1; '+row.platform+'</div>' : '')
        + ucHtml;
      tip.classList.add('show');
      var r = cont.getBoundingClientRect();
      var x = ev.clientX - r.left + 14;
      var y = ev.clientY - r.top - 10;
      if (x + 240 > W) x -= 260;
      tip.style.left = x + 'px';
      tip.style.top = y + 'px';
    });
    el.addEventListener('mouseleave', function(){ tip.classList.remove('show'); });
    el.addEventListener('click', function() {
      document.querySelectorAll('.region').forEach(function(p){ p.classList.remove('sel'); });
      el.classList.add('sel');
      openPanel(sn);
    });
    svg.appendChild(el);
  });
}

renderStats();
renderLegend();
window.addEventListener('load', function(){ requestAnimationFrame(initMap); });
