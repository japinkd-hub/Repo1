<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STOZ Kaart + DigiDex | Digizo.nu</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
/* === RESET === */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

/* === VARIABELEN === */
:root {
  --navy: #1b1e4c;
  --purple: #7a00df;
  --teal: #5ad1c4;
  --light: #f4f6fb;
  --card: #ffffff;
  --border: #e2e6f0;
  --text: #1a1a2e;
  --muted: #6b7280;
  --radius: 10px;
  --shadow: 0 2px 12px rgba(27,30,76,.12);
}

/* === TOPNIVEAU LAYOUT === */
html { height: 100%; }
body {
  height: 100%;
  font-family: 'Segoe UI', system-ui, sans-serif;
  background: var(--light);
  color: var(--text);
  overflow: hidden;
}

#page-wrap {
  display: flex;
  flex-direction: column;
  height: 100vh;
}

/* === TOP BAR === */
#topbar {
  flex-shrink: 0;
  height: 52px;
  background: var(--navy);
  color: #fff;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 18px;
  z-index: 200;
}
#topbar h1 { font-size: 15px; font-weight: 700; }
.tbadge {
  font-size: 10px; font-weight: 700;
  padding: 2px 9px; border-radius: 20px;
}
#btn-back {
  display: none; margin-left: auto;
  padding: 5px 13px;
  border: 1px solid rgba(255,255,255,.35); border-radius: 6px;
  background: transparent; color: #fff;
  font-size: 12px; font-weight: 600; cursor: pointer;
}
#btn-back:hover { background: rgba(255,255,255,.15); }
#view-label { font-size: 11px; color: rgba(255,255,255,.55); margin-left: auto; }

/* === SPLIT CONTAINER === */
#split {
  flex: 1;
  display: flex;
  min-height: 0; /* critical voor flex children */
}

/* === KAART PANEEL === */
#map-pane {
  flex: 1;
  min-width: 0;
  position: relative;
  overflow: hidden;
  background: linear-gradient(160deg, #e4ecf5 0%, #d8e6f0 100%);
  border-right: 2px solid var(--border);
  transition: flex .35s ease;
}

#map-svg { width: 100%; height: 100%; display: block; }

/* Provincie shapes */
.pshape {
  stroke: #fff;
  stroke-width: 1.5;
  cursor: pointer;
  transition: filter .15s, stroke-width .15s;
}
.pshape:hover { filter: brightness(.82); stroke-width: 2.5; }
.pshape.sel { stroke: var(--navy); stroke-width: 3; filter: brightness(.78); }

/* Zorgkantoor overlay */
.zkshape {
  fill: rgba(255,255,255,0);
  stroke: rgba(255,255,255,.7);
  stroke-width: .8;
  stroke-dasharray: 4,3;
  pointer-events: none;
  opacity: 0;
  transition: opacity .4s;
}
.zkshape.vis { opacity: 1; }

/* Labels */
.prov-lbl {
  font-size: 11px; font-weight: 700;
  fill: rgba(255,255,255,.9);
  text-anchor: middle; dominant-baseline: middle;
  pointer-events: none;
  text-shadow: 0 1px 2px rgba(0,0,0,.4);
}
.zk-lbl {
  font-size: 8px; font-weight: 600;
  fill: rgba(0,0,50,.65);
  text-anchor: middle; dominant-baseline: middle;
  pointer-events: none;
  opacity: 0; transition: opacity .4s;
}
.zk-lbl.vis { opacity: 1; }

/* Kaart tooltip */
#ktt {
  position: absolute; pointer-events: none; z-index: 50;
  background: #fff; border: 1px solid var(--border);
  border-radius: 8px; box-shadow: var(--shadow);
  padding: 10px 13px; max-width: 230px; font-size: 12px;
  opacity: 0; transition: opacity .12s;
}
#ktt h4 { font-size: 13px; font-weight: 700; margin-bottom: 5px; color: var(--navy); }
.kr { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 3px; }
.kl { color: var(--muted); font-size: 11px; }
.kv { font-weight: 600; font-size: 11px; }

/* Provincie mini-panel */
#prov-panel {
  position: absolute; top: 60px; left: 12px;
  width: 185px;
  background: var(--card);
  border-radius: 10px;
  box-shadow: var(--shadow);
  padding: 11px 13px;
  font-size: 11px;
  display: none;
  max-height: calc(100% - 80px);
  overflow-y: auto;
  z-index: 30;
}
#prov-panel h3 { font-size: 13px; font-weight: 700; color: var(--navy); margin-bottom: 8px; }
.sp { display: inline-flex; align-items: center; font-size: 10px; font-weight: 700;
  padding: 2px 7px; border-radius: 10px; margin: 2px 2px 0 0; }
.sp-s { background: #fff3cd; color: #856404; }
.sp-z { background: #ede8ff; color: var(--purple); }
.sp-i { background: #dcfce7; color: #15803d; }
.zk-li { display: flex; align-items: center; gap: 5px;
  padding: 4px 0; border-bottom: 1px solid #f0f2f8; }
.zk-li:last-child { border-bottom: none; }
.zk-cd { font-size: 9px; font-weight: 700; padding: 1px 5px;
  border-radius: 8px; background: #ede8ff; color: var(--purple); flex-shrink: 0; }

/* Map knoppen */
#map-btns {
  position: absolute; bottom: 12px; right: 12px;
  display: flex; flex-direction: column; gap: 5px; z-index: 30;
}
.mbtn {
  width: 30px; height: 30px; border: none; border-radius: 6px;
  background: var(--card); box-shadow: var(--shadow);
  font-size: 14px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.mbtn:hover { background: #eef2ff; }

/* === SCHEIDINGSLIJN === */
#divider {
  width: 6px; flex-shrink: 0;
  cursor: col-resize; background: var(--border);
  position: relative; z-index: 100;
}
#divider:hover, #divider.drag { background: var(--purple); }

/* === DIGIDEX PANEEL === */
#ddx-pane {
  flex: 1; min-width: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
  transition: flex .35s ease;
}
#ddx-topbar {
  flex-shrink: 0;
  padding: 8px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
#ddx-topbar h2 { font-size: 13px; font-weight: 700; color: var(--navy); }
#ddx-ctx {
  margin-left: auto;
  font-size: 10px; color: var(--muted);
  padding: 2px 9px; background: var(--light);
  border-radius: 20px;
}
#ddx-scroll {
  flex: 1; min-height: 0;
  overflow-y: auto;
}

/* === VIEW TOGGLE === */
#view-toggle {
  position: fixed; bottom: 14px; left: 50%;
  transform: translateX(-50%);
  display: flex; gap: 2px;
  background: var(--navy);
  border-radius: 24px; padding: 3px;
  z-index: 300;
  box-shadow: 0 4px 18px rgba(27,30,76,.35);
}
.vtb {
  padding: 6px 15px; border: none; border-radius: 20px;
  font-size: 11px; font-weight: 700; cursor: pointer;
  background: transparent; color: rgba(255,255,255,.55);
  transition: all .15s;
}
.vtb.on { background: #fff; color: var(--navy); }

/* === DIGIDEX CSS (ingebakken, gescopet) === */
#ddx-scroll .ddx-widget { min-height: unset; }

.ddx-widget {
  --dz-navy:#1b1e4c;--dz-purple:#7a00df;--dz-purple-mid:#8448a2;
  --dz-purple-light:#c1a3d0;--dz-purple-pale:#f5f0fb;
  --dz-teal:#5ad1c4;--dz-teal-light:#ace8e1;--dz-teal-pale:#eaf9f7;
  --dz-text:#2a2a2a;--dz-muted:#6b6b6b;--dz-border:#ddd6e8;--dz-bg:#f7f5fc;
  --s-vvt:#1b1e4c;--s-vvt-bg:#e8e9f0;--s-vvt-mid:#6b70a8;
  --s-ggz:#7a00df;--s-ggz-bg:#f3edf8;--s-ggz-mid:#9e3ee8;
  --s-ha:#0a6e50;--s-ha-bg:#e1f5ee;--s-ha-mid:#1a9870;
  --s-hap:#375454;--s-hap-bg:#e6f0f0;--s-hap-mid:#5a8080;
  --s-msz:#2d4a6e;--s-msz-bg:#e4ecf5;--s-msz-mid:#4a72a0;
  --s-sd:#0a8a80;--s-sd-bg:#e0f5f3;--s-sd-mid:#12b0a4;

  font-family:'Inter',sans-serif;background:var(--dz-bg);color:var(--dz-text);min-height:100vh;padding:24px 16px 48px
}.ddx-widget *{box-sizing:border-box;margin:0;padding:0}

/* ── Page header ── */.ddx-widget .page-header{max-width:920px;margin:0 auto 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}.ddx-widget .page-logo{height:36px}.ddx-widget .page-title{font-size:1.25rem;font-weight:700;color:var(--dz-navy)}.ddx-widget .page-sub{font-size:.8rem;color:var(--dz-muted);margin-left:auto}

/* ── Source bar ── */.ddx-widget .source-bar{max-width:920px;margin:0 auto 16px;display:flex;gap:8px;flex-wrap:wrap}.ddx-widget .src-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;border:2px solid var(--dz-border);background:#fff;font-size:.8rem;font-weight:600;color:var(--dz-muted);cursor:pointer;transition:all .15s}.ddx-widget .src-btn:hover{border-color:var(--dz-purple-light);color:var(--dz-purple)}.ddx-widget .src-btn.active{border-color:var(--dz-purple);background:var(--dz-purple-pale);color:var(--dz-purple)}.ddx-widget .src-count{background:var(--dz-border);color:var(--dz-muted);border-radius:10px;padding:1px 7px;font-size:.72rem;font-weight:700}.ddx-widget .src-btn.active .src-count{background:var(--dz-purple);color:#fff}

/* ── Outer machine ── */.ddx-widget .machine-wrap{max-width:920px;margin:0 auto;display:flex;gap:16px;align-items:flex-start}.ddx-widget .machine{width:760px;flex-shrink:0;background:#fff;border-radius:18px;border:1.5px solid var(--dz-border);box-shadow:0 4px 24px rgba(27,30,76,.07);overflow:hidden;position:relative}

/* ── Nav bar ── */.ddx-widget .nav-bar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--dz-navy);border-bottom:2px solid rgba(255,255,255,.08)}.ddx-widget .nav-arrow{background:rgba(255,255,255,.12);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;transition:background .15s;flex-shrink:0}.ddx-widget .nav-arrow:hover{background:rgba(255,255,255,.25)}.ddx-widget .nav-arrow:disabled{opacity:.3;cursor:default}.ddx-widget .nav-center{display:flex;flex-direction:column;align-items:center;gap:6px;flex:1;padding:0 12px}.ddx-widget .nav-counter{color:rgba(255,255,255,.7);font-size:.72rem;font-weight:500}.ddx-widget .pips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;max-width:480px}.ddx-widget .pip{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);cursor:pointer;transition:all .15s;flex-shrink:0}.ddx-widget .pip.active{background:var(--dz-teal);transform:scale(1.3)}.ddx-widget .pip:hover{background:rgba(255,255,255,.5)}

/* ── Card slot ── */.ddx-widget .card-slot{min-height:440px}.ddx-widget .card{display:none;flex-direction:column}.ddx-widget .card.visible{display:flex}

/* ── Card header ── */.ddx-widget .card-head{padding:16px 20px 12px;border-bottom:1px solid var(--dz-border);display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.ddx-widget .card-head-left{display:flex;flex-direction:column;gap:6px}.ddx-widget .card-proc-link{font-size:1rem;font-weight:700;color:var(--dz-navy);text-decoration:none;line-height:1.3}.ddx-widget .card-proc-link:hover{color:var(--dz-purple);text-decoration:underline}.ddx-widget .card-pills{display:flex;gap:5px;flex-wrap:wrap}.ddx-widget .pill{padding:2px 9px;border-radius:10px;font-size:.7rem;font-weight:700;letter-spacing:.02em}.ddx-widget .card-badge-row{display:flex;gap:6px;align-items:center}.ddx-widget .src-badge{font-size:.65rem;font-weight:700;padding:2px 7px;border-radius:8px;letter-spacing:.04em}.ddx-widget .src-badge.stoz{background:#e8e9f0;color:#1b1e4c}.ddx-widget .src-badge.zonmw{background:var(--dz-purple-pale);color:var(--dz-purple)}

/* ── Band (shared) ── */.ddx-widget .band{padding:14px 18px}.ddx-widget .band+.band{border-top:1px solid var(--dz-border)}.ddx-widget .band-label{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px;display:flex;align-items:center;gap:6px}.ddx-widget .band-label .band-tag{padding:2px 8px;border-radius:6px;font-size:.65rem;font-weight:700}.ddx-widget .band-ph{background:var(--dz-bg);border:1.5px dashed var(--dz-border);border-radius:10px;padding:14px 16px;text-align:center;color:var(--dz-muted);font-size:.78rem}

/* ── Timeline ── */.ddx-widget .tl-wrap{position:relative;margin-bottom:6px}.ddx-widget .tl-bar{display:flex;border-radius:6px;overflow:hidden;height:28px;position:relative}.ddx-widget .tl-seg{display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;overflow:hidden;white-space:nowrap;padding:0 4px;cursor:default;transition:filter .15s}.ddx-widget .tl-seg:hover{filter:brightness(1.1)}.ddx-widget .tl-nu{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--dz-teal);border-radius:2px;pointer-events:none;z-index:10}.ddx-widget .tl-nu::after{content:'nu';position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:.58rem;font-weight:700;color:var(--dz-teal);white-space:nowrap}.ddx-widget .tl-axis{display:flex;position:relative;height:16px;margin-top:3px}.ddx-widget .tl-tick{position:absolute;font-size:.6rem;color:var(--dz-muted);transform:translateX(-50%)}.ddx-widget .tl-tick.right{transform:translateX(-100%)}

/* ── STOZ route ── */.ddx-widget .stoz-route-pills{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.ddx-widget .route-pill{display:flex;align-items:center;gap:4px;padding:3px 9px;border-radius:10px;font-size:.68rem;font-weight:600;cursor:pointer;border:1.5px solid transparent;transition:all .15s}.ddx-widget .route-pill:hover{opacity:.85}.ddx-widget .route-pill .rp-count{font-weight:800}

/* STOZ segment colors */.ddx-widget .seg-strat{background:#3d3f9e;color:#fff}.ddx-widget .seg-impl{background:#d97706;color:#fff}.ddx-widget .seg-opsch{background:#059669;color:#fff}.ddx-widget .seg-eval{background:#2563eb;color:#fff}.ddx-widget .rp-strat{background:#e8e9f6;color:#3d3f9e;border-color:#3d3f9e30}.ddx-widget .rp-impl{background:#fef3c7;color:#d97706;border-color:#d9770630}.ddx-widget .rp-opsch{background:#d1fae5;color:#059669;border-color:#05966930}.ddx-widget .rp-eval{background:#dbeafe;color:#2563eb;border-color:#2563eb30}

/* ── Kennis section ── */.ddx-widget .kennis-section{margin-top:10px;background:var(--dz-teal-pale);border-radius:8px;padding:10px 12px}.ddx-widget .kennis-title{font-size:.65rem;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--dz-navy);margin-bottom:6px}.ddx-widget .kennis-text{font-size:.72rem;color:var(--dz-text);line-height:1.5}

/* ── ZonMw band ── */.ddx-widget .zm-meta{font-size:.7rem;color:var(--dz-muted);margin-bottom:8px}.ddx-widget .zm-tl-wrap{position:relative;margin-bottom:6px}.ddx-widget .zm-orgs-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.ddx-widget .zm-org-group{display:flex;flex-direction:column;gap:4px;min-width:150px;flex:1}.ddx-widget .zm-org-group-label{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--dz-muted);margin-bottom:2px}.ddx-widget .org-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:.7rem;font-weight:600;cursor:pointer;background:var(--dz-purple-pale);color:var(--dz-purple);border:1.5px solid var(--dz-purple-light);transition:all .15s;margin-bottom:3px}.ddx-widget .org-tag:hover{background:var(--dz-purple);color:#fff}.ddx-widget .voucher-tag{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:7px;font-size:.67rem;font-weight:600;cursor:pointer;background:#fff;color:var(--dz-muted);border:1.5px solid var(--dz-border);transition:all .15s;margin-bottom:3px}.ddx-widget .voucher-tag:hover{border-color:var(--dz-purple);color:var(--dz-purple)}.ddx-widget .stoz-cross-ref{margin-top:8px;padding-top:7px;border-top:1px dashed var(--dz-border)}.ddx-widget .stoz-org-pill{font-size:.67rem;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:5px;border:1px solid;cursor:pointer;background:#fff8e1;color:#e65100;border-color:#ffcc02;transition:filter .15s;margin:2px}.ddx-widget .stoz-org-pill:hover{filter:brightness(0.9)}.ddx-widget .stoz-badge{font-size:.55rem;font-weight:700;padding:1px 5px;border-radius:10px;background:#e8a000;color:#fff}.ddx-widget .route-indicator-mini{font-size:.55rem;padding:1px 4px;border-radius:8px;font-weight:700}.ddx-widget .route-opsch{background:#e8f5e9;color:#2e7d32}.ddx-widget .route-eval{background:#e3f2fd;color:#1565c0}.ddx-widget .route-impl{background:#fff3e0;color:#e65100}.ddx-widget .route-strat{background:#e8eaf6;color:#3949ab}.ddx-widget .kennis-empty{font-size:.67rem;padding:3px 10px;border-radius:20px;font-weight:600;display:inline-flex;align-items:center;gap:5px;background:#f5f5f5;color:#9e9e9e;border:1px solid #e0e0e0;cursor:default;font-style:italic;opacity:.7}.ddx-widget .v-lbl{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--dz-muted);width:100%;display:flex;align-items:center;gap:6px;margin-bottom:4px}

/* ── STOZ org tags ── */.ddx-widget .stoz-org-tag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:.7rem;font-weight:600;cursor:pointer;background:var(--dz-bg);color:var(--dz-navy);border:1.5px solid var(--dz-border);transition:all .15s;margin-bottom:3px}.ddx-widget .stoz-org-tag:hover{border-color:var(--dz-navy);background:var(--dz-navy);color:#fff}

/* ── In-card Drawer ── */.ddx-widget .drawer-overlay{display:none;position:absolute;inset:0;background:rgba(27,30,76,.18);z-index:40;backdrop-filter:blur(1px);border-radius:18px}.ddx-widget .drawer-overlay.open{display:block}.ddx-widget .drawer{position:absolute;right:0;top:0;bottom:0;width:320px;background:#fff;border-left:2px solid var(--dz-border);border-radius:0 18px 18px 0;z-index:50;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s cubic-bezier(.4,0,.2,1);overflow:hidden}.ddx-widget .drawer.open{transform:translateX(0)}.ddx-widget .drawer-head{padding:14px 16px 10px;border-bottom:1px solid var(--dz-border);display:flex;align-items:flex-start;gap:10px}.ddx-widget .drawer-icon{font-size:1.6rem;flex-shrink:0;line-height:1}.ddx-widget .drawer-head-text{flex:1;min-width:0}.ddx-widget .drawer-title{font-size:.9rem;font-weight:700;color:var(--dz-navy);line-height:1.3}.ddx-widget .drawer-sub{font-size:.72rem;color:var(--dz-muted);margin-top:2px}.ddx-widget .drawer-close{background:none;border:none;cursor:pointer;color:var(--dz-muted);font-size:1.2rem;flex-shrink:0;line-height:1;padding:0 2px;transition:color .15s}.ddx-widget .drawer-close:hover{color:var(--dz-navy)}.ddx-widget .drawer-body{flex:1;overflow-y:auto;padding:14px 16px}.ddx-widget .drawer-section{margin-bottom:14px}.ddx-widget .drawer-section-title{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--dz-muted);margin-bottom:6px}.ddx-widget .drawer-row{display:flex;gap:8px;margin-bottom:5px}.ddx-widget .drawer-row-label{font-size:.72rem;font-weight:600;color:var(--dz-muted);min-width:80px;flex-shrink:0}.ddx-widget .drawer-row-val{font-size:.72rem;color:var(--dz-text);line-height:1.4}.ddx-widget .drawer-contacts{display:flex;flex-direction:column;gap:8px}.ddx-widget .contact-card{background:var(--dz-bg);border-radius:8px;padding:10px 12px}.ddx-widget .contact-name{font-size:.78rem;font-weight:700;color:var(--dz-navy)}.ddx-widget .contact-role{font-size:.68rem;color:var(--dz-muted);margin-top:1px}.ddx-widget .contact-links{display:flex;gap:8px;margin-top:5px;flex-wrap:wrap}.ddx-widget .contact-link{font-size:.65rem;color:var(--dz-purple);text-decoration:none;font-weight:600}.ddx-widget .contact-link:hover{text-decoration:underline}.ddx-widget .drawer-btn{display:block;width:100%;padding:9px 14px;border-radius:9px;border:none;font-size:.78rem;font-weight:700;cursor:pointer;text-align:center;text-decoration:none;transition:all .15s;margin-top:6px}.ddx-widget .drawer-btn.primary{background:var(--dz-purple);color:#fff}.ddx-widget .drawer-btn.primary:hover{background:#6200c0}.ddx-widget .drawer-btn.secondary{background:var(--dz-bg);color:var(--dz-navy);border:1.5px solid var(--dz-border)}.ddx-widget .drawer-btn.secondary:hover{border-color:var(--dz-navy)}.ddx-widget .drawer-kennis{background:var(--dz-teal-pale);border-radius:8px;padding:10px 12px;margin-top:8px}.ddx-widget .drawer-kennis-title{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--dz-navy);margin-bottom:5px}.ddx-widget .drawer-kennis-text{font-size:.72rem;color:var(--dz-text);line-height:1.5}

/* ── STOZ aanvragers-sectie ── */.ddx-widget .stoz-orgs-section{ margin-top: 10px; }.ddx-widget .stoz-org-group{ margin-bottom: 8px; }.ddx-widget .stoz-org-label{

/* ── AAN1: Route-tags conform org-tag stijl ── */.ddx-widget .stoz-route-tag-row{ display: flex; flex-wrap: wrap; gap: 4px; }.ddx-widget .stoz-tag-impl{

/* ── AAN2: STOZ-infokaart ── */.ddx-widget .stoz-info-card{ border-top: 3px solid #f59e0b; }.ddx-widget .stoz-info-grid{

/* ── impl-drawer (slides up from bottom of machine) ── */.ddx-widget .impl-drawer-overlay{

    .attr('class','zk-lbl')
    .attr('x', f => MAP_pathFn.centroid(f)[0])
    .attr('y', f => MAP_pathFn.centroid(f)[1])
    .text(f => f.properties.statcode);

  // Provincie layer (GeoJSON)
  MAP_gProv = MAP_svgEl.append('g').attr('id','g-prov');
  MAP_gProv.selectAll('.pshape')
    .data(PROV_GEOJSON.features).enter().append('path')
    .attr('class','pshape')
    .attr('d', MAP_pathFn)
    .attr('data-naam', f => f.properties.provincie)
    .attr('fill', f => PROV_COLORS[f.properties.provincie] || '#9ab')
    .on('mouseenter', MAP_ttShow)
    .on('mousemove',  MAP_ttMove)
    .on('mouseleave', MAP_ttHide)
    .on('click', MAP_provKlik);

  MAP_gProv.selectAll('.prov-lbl')
    .data(PROV_GEOJSON.features).enter().append('text')
    .attr('class','prov-lbl')
    .attr('x', f => MAP_pathFn.centroid(f)[0])
    .attr('y', f => MAP_pathFn.centroid(f)[1])
    .text(f => (f.properties.provincie||'')
      .replace('Noord-','N.').replace('Zuid-','Z.')
      .replace('-Holland',''));

  // Laad DB-data indien proxy actief
  MAP_laadDbData();
}

async function MAP_laadDbData() {
  try {
    const r = await fetch('/db/all', {signal: AbortSignal.timeout(3000)});
    if (!r.ok) throw new Error();
    const j = await r.json();
    MAP_dbData = j.data || [];
    document.getElementById('tb-s').textContent = MAP_dbData.length + ' STOZ';
    MAP_kleurOpAantallen();
  } catch {
    const tot = Object.values(STOZ_ROUTE_DATA).reduce((s,v)=>s+v.total,0);
    document.getElementById('tb-s').textContent = tot + '+ STOZ';
  }
}

function MAP_kleurOpAantallen() {
  const counts = {};
  MAP_dbData.forEach(p => { if(p.provincie) counts[p.provincie]=(counts[p.provincie]||0)+1; });
  const max = Math.max(...Object.values(counts), 1);
  MAP_gProv.selectAll('.pshape').attr('opacity', function() {
    const naam = d3.select(this).attr('data-naam');
    return counts[naam] ? (0.55 + 0.45 * counts[naam]/max) : 0.45;
  });
}

function MAP_provKlik(ev, d) {
  const naam = d.properties.provincie;
  if (MAP_selProv === naam) { MAP_resetKaart(); return; }
  MAP_selProv = naam;

  MAP_gProv.selectAll('.pshape')
    .classed('sel', function() { return d3.select(this).attr('data-naam') === naam; });

  // Toon zorgkantoor overlay voor deze provincie
  const zkSet = new Set(PROV_TO_ZK[naam] || []);
  MAP_gZK.selectAll('.zkshape').classed('vis', function() {
    return zkSet.has(d3.select(this).attr('data-code'));
  });
  MAP_gZK.selectAll('.zk-lbl').classed('vis', function() {
    return zkSet.has(d3.select(this).attr('data-code'));
  });

  // Inzoomen
  const [[x0,y0],[x1,y1]] = MAP_pathFn.bounds(d);
  const pane = document.getElementById('map-pane');
  const W = pane.clientWidth, H = pane.clientHeight;
  const scale = Math.min(8, 0.82 / Math.max((x1-x0)/W, (y1-y0)/H));
  const tx = W/2 - scale*(x0+x1)/2;
  const ty = H/2 - scale*(y0+y1)/2;
  MAP_svgEl.transition().duration(650)
    .call(MAP_zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));

  // Provincie panel
  MAP_toonProvPanel(naam, zkSet);

  // DigiDex context
  MAP_filterDdxProv(naam);

  document.getElementById('btn-back').style.display = 'block';
  document.getElementById('view-label').style.display = 'none';
}

function MAP_resetKaart() {
  MAP_selProv = null;
  MAP_gProv.selectAll('.pshape').classed('sel', false).attr('opacity', null);
  MAP_gZK.selectAll('.zkshape, .zk-lbl').classed('vis', false);
  MAP_svgEl.transition().duration(500).call(MAP_zoom.transform, d3.zoomIdentity);
  document.getElementById('prov-panel').style.display = 'none';
  document.getElementById('btn-back').style.display = 'none';
  document.getElementById('view-label').style.display = '';
  document.getElementById('ddx-ctx').textContent = 'Heel Nederland';
  // Verwijder provincie-badges in DigiDex
  document.querySelectorAll('.prov-badge').forEach(el => el.remove());
  if (window.filterBron) filterBron('all');
  if (MAP_dbData.length) MAP_kleurOpAantallen();
}

function MAP_toonProvPanel(naam, zkSet) {
  const pp = document.getElementById('prov-panel');
  const provP = MAP_dbData.filter(p => p.provincie === naam);
  const routes = {};
  provP.forEach(p => { if(p.route) routes[p.route]=(routes[p.route]||0)+1; });

  const zkObj = topojson.feature(TOPO_ZK, Object.values(TOPO_ZK.objects)[0]);
  const zkNames = zkObj.features
    .filter(f => zkSet.has(f.properties.statcode))
    .map(f => ({code: f.properties.statcode, naam: f.properties.statnaam}));

  const inkCount = provP.filter(p=>p.inkoper).length;

  pp.innerHTML = `
    <h3>${naam}</h3>
    <div style="margin-bottom:8px">
      <span class="sp sp-s">STOZ ${provP.length}</span>
      ${inkCount ? `<span class="sp sp-i">Inkoper ${inkCount}</span>` : ''}
      <span class="sp sp-z">ZonMw nationaal</span>
    </div>
    ${Object.entries(routes).map(([r,n])=>`
      <div style="font-size:10px;color:var(--muted);margin-bottom:2px">${r}: <b>${n}</b></div>`).join('')}
    <div style="margin-top:10px;margin-bottom:5px;font-size:9px;font-weight:700;
      text-transform:uppercase;letter-spacing:.5px;color:var(--muted)">Zorgkantoorregios</div>
    ${zkNames.map(z=>`
      <div class="zk-li"><span class="zk-cd">${z.code}</span><span>${z.naam}</span></div>`).join('')}
    <button onclick="MAP_filterDdxProv('${naam}')" style="width:100%;margin-top:10px;padding:6px;
      border:none;border-radius:6px;background:var(--purple);color:#fff;
      font-size:11px;font-weight:600;cursor:pointer;">
      DigiDex voor ${naam}
    </button>`;
  pp.style.display = 'block';
}

function MAP_filterDdxProv(naam) {
  document.getElementById('ddx-ctx').textContent = naam;
  document.getElementById('ddx-scroll').scrollTop = 0;

  // Markeer kaarten met aanvragers uit deze provincie
  const lokaleAanvr = new Set(
    MAP_dbData.filter(p=>p.provincie===naam && p.aanvrager)
      .map(p=>p.aanvrager.split(' ').slice(0,3).join(' '))
  );
  document.querySelectorAll('.prov-badge').forEach(el=>el.remove());
  if (!lokaleAanvr.size) return;

  document.querySelectorAll('.ddx-card').forEach(card => {
    const tekst = card.textContent;
    let match = false;
    lokaleAanvr.forEach(a => { if(tekst.includes(a)) match = true; });
    if (match) {
      const badge = document.createElement('div');
      badge.className = 'prov-badge';
      badge.style.cssText = `position:absolute;top:6px;right:6px;
        background:var(--teal);color:var(--navy);font-size:9px;font-weight:700;
        padding:2px 7px;border-radius:10px;z-index:5;`;
      badge.textContent = '📍 ' + naam;
      if (getComputedStyle(card).position === 'static')
        card.style.position = 'relative';
      card.appendChild(badge);
    }
  });
}

// ═══ TOOLTIP ════════════════════════════════════════════════
function MAP_ttShow(ev, d) {
  const naam = d.properties.provincie;
  const pp = MAP_dbData.filter(p => p.provincie === naam);
  const zk = (PROV_TO_ZK[naam]||[]).length;
  document.getElementById('ktt').innerHTML = `
    <h4>${naam}</h4>
    <div class="kr"><span class="kl">STOZ (in DB)</span><span class="kv">${pp.length}</span></div>
    <div class="kr"><span class="kl">Met inkoper</span><span class="kv">${pp.filter(p=>p.inkoper).length}</span></div>
    <div class="kr"><span class="kl">Zorgkantoorregios</span><span class="kv">${zk}</span></div>
    <div class="kr"><span class="kl">ZonMw VVH</span><span class="kv">nationaal</span></div>
    <div style="margin-top:5px;font-size:10px;color:var(--purple)">Klik voor details →</div>`;
  document.getElementById('ktt').style.opacity = '1';
  MAP_ttMove(ev);
}
function MAP_ttMove(ev) {
  const r = document.getElementById('map-pane').getBoundingClientRect();
  let x = ev.clientX - r.left + 14, y = ev.clientY - r.top - 14;
  if (x + 240 > r.width) x = ev.clientX - r.left - 244;
  Object.assign(document.getElementById('ktt').style, {left:x+'px', top:y+'px'});
}
function MAP_ttHide() { document.getElementById('ktt').style.opacity = '0'; }

// ═══ VIEW TOGGLE ════════════════════════════════════════════
function MAP_setView(v) {
  const mp = document.getElementById('map-pane');
  const dp = document.getElementById('ddx-pane');
  const dv = document.getElementById('divider');
  if (v === 'split') {
    mp.style.flex = '1'; dp.style.flex = '1'; dv.style.display = '';
  } else if (v === 'map') {
    mp.style.flex = '1'; dp.style.flex = '0'; dv.style.display = 'none';
  } else {
    mp.style.flex = '0'; dp.style.flex = '1'; dv.style.display = 'none';
  }
  ['s','m','d'].forEach((x,i) => {
    document.getElementById('vt-'+x).classList.toggle('on', ['split','map','ddx'][i]===v);
  });
  // Herbereken kaart na resize
  if (v !== 'ddx') setTimeout(() => {
    const pane = document.getElementById('map-pane');
    MAP_svgEl.attr('viewBox',`0 0 ${pane.clientWidth} ${pane.clientHeight}`);
  }, 380);
}

// ═══ VERSLEEPBARE SCHEIDINGSLIJN ════════════════════════════
(function() {
  const div = document.getElementById('divider');
  const sp  = document.getElementById('split');
  let drag = false, startX, startMW, startDW;
  div.addEventListener('mousedown', e => {
    drag = true; startX = e.clientX;
    startMW = document.getElementById('map-pane').clientWidth;
    startDW = document.getElementById('ddx-pane').clientWidth;
    div.classList.add('drag');
    document.body.style.userSelect = 'none';
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    const dx = e.clientX - startX;
    const total = startMW + startDW;
    const newM = Math.min(total*0.8, Math.max(total*0.2, startMW + dx));
    document.getElementById('map-pane').style.flex = `0 0 ${newM}px`;
    document.getElementById('ddx-pane').style.flex = `0 0 ${total-newM}px`;
  });
  window.addEventListener('mouseup', () => {
    drag = false; div.classList.remove('drag');
    document.body.style.userSelect = '';
  });
})();


</script>

function hasStoz(proc){ return proc.stoz && STOZ_ROUTE_DATA[proc.stoz]; }
function hasZonmw(proc){ return proc.zonmw && ZONMW_CARDS[proc.zonmw]; }

function bronMatch(proc, bron){
  if(proc._infokaart || proc._implkaart) return true;
  const s = hasStoz(proc), z = hasZonmw(proc);
  if(bron==='all') return true;
  if(bron==='stoz') return s;
  if(bron==='zonmw') return z;
  if(bron==='both') return s && z;
  return true;
}
function sectorMatch(proc, sec){
  if(proc._infokaart || proc._implkaart) return true;
  if(sec==='all') return true;
  return proc.sectoren.includes(sec);
}

// stoNuPct verwijderd: STOZ-routes zijn geen continuüm
function zmNuPct(tlStart, tlEnd){
  const s = new Date(tlStart), e = new Date(tlEnd);
  return Math.max(0, Math.min(100, (TODAY - s)/(e - s)*100));
}

function e(tag, cls, html){
  const el = document.createElement(tag);
  if(cls) el.className = cls;
  if(html != null) el.innerHTML = html;
  return el;
}

function buildStozBand(proc){
  const d  = STOZ_ROUTE_DATA[proc.stoz];
  const vd = STOZ_VWS_DATA[proc.stoz] || STOZ_VWS_DATA[proc.naam] || null;
  const wrap = e('div','band');

  // Band header
  const lbl = e('div','band-label');
  lbl.innerHTML = `<span class="band-tag" style="background:#fff3cd;color:#856404;border:1px solid #ffc107">STOZ</span> ${proc.stoz || proc.naam}`;
  wrap.appendChild(lbl);

  if(!d){
    wrap.appendChild(e('div','band-ph','Geen STOZ-routedata beschikbaar voor dit proces'));
    return wrap;
  }

  // ── COMPACTE ROUTESAMENVATTING (detail via drawer) ──────────────────
  // Route-samenvatting: gebruik org-tag stijl conform de rest van de kaart
  const routeSummary = e('div','zm-orgs-row');  // zelfde container als ZonMw

  const routeGrp = e('div','zm-org-group');
  routeGrp.appendChild(e('div','zm-org-group-label','Subsidieroutes STOZ 2024/2025'));

  const tagRow = e('div','stoz-route-tag-row');

  if(d.impl){
    const tag = e('span','org-tag stoz-tag-impl');
    tag.title = 'Implementatiestart-route: eerste inzet van technologie, incl. strategievorming. Klik voor details.';
    tag.innerHTML = `Impl. &amp; Strat. <span class="route-count">${d.impl}</span>`;
    tag.onclick = () => openStozDrawer(proc, null);
    tagRow.appendChild(tag);
  }
  if(d.opsch){
    const tag = e('span','org-tag stoz-tag-opsch-main');
    tag.title = 'Opschalingsroute: technologie uitrollen naar meer locaties. Kennisinstituut optioneel. Klik voor details.';
    tag.innerHTML = `Opschaling <span class="route-count">${d.opsch}</span>`;
    tag.onclick = () => openStozDrawer(proc, null);
    tagRow.appendChild(tag);
  }
  if(d.eval){
    const tag = e('span','org-tag stoz-tag-eval-main');
    tag.title = 'Evaluatieroute: wetenschappelijke effectmeting. Kennisinstituut verplicht per subsidieregeling. Klik voor details.';
    tag.innerHTML = `Evaluatie ✶ <span class="route-count">${d.eval}</span>`;
    tag.onclick = () => openStozDrawer(proc, null);
    tagRow.appendChild(tag);
  }

  routeGrp.appendChild(tagRow);
  routeSummary.appendChild(routeGrp);
  wrap.appendChild(routeSummary);

  // ── AANVRAGERS (alle 3 routes: Impl./Strat., Opschaling, Evaluatie) ─────
  if(vd && vd.aanvragers && vd.aanvragers.length > 0){
    const orgsSection = e('div','stoz-orgs-section');
    const implAanvr  = vd.aanvragers.filter(a => a.r === 'impl');
    const opschAanvr = vd.aanvragers.filter(a => a.r === 'opsch');
    const evalAanvr  = vd.aanvragers.filter(a => a.r === 'eval');

    function makeAanvrGroup(label, aanvrs, tagClass, routeKey){
      if(!aanvrs.length) return;
      const grp = e('div','zm-org-group');
      grp.appendChild(e('div','zm-org-group-label', label));
      const tagRow = e('div','org-tags');
      aanvrs.forEach(a => {
        const tag = e('span','org-tag ' + tagClass);
        tag.title = (a.k ? 'Kennisinstituut: ' + a.k + ' | ' : '') +
                    (a.l && a.l.length ? 'Tech: ' + a.l.join(', ') : 'Klik voor details');
        tag.innerHTML = a.a + (a.k ? ` <span style="font-size:10px">🎓</span>` : '');
        tag.onclick = () => openStozDrawer(proc, a);
        tagRow.appendChild(tag);
      });
      grp.appendChild(tagRow);
      orgsSection.appendChild(grp);
    }

    makeAanvrGroup('Implementatiestart & Strategievorming', implAanvr,  'stoz-tag-impl',       'impl');
    makeAanvrGroup('Opschalingsroute',                       opschAanvr, 'stoz-tag-opsch-main', 'opsch');
    makeAanvrGroup('Evaluatieroute ✶',                       evalAanvr,  'stoz-tag-eval-main',  'eval');

    wrap.appendChild(orgsSection);
  }

  // ── TECHNOLOGIEËN / LEVERANCIERS ──────────────────────────────────────
  if(vd && vd.leveranciers && vd.leveranciers.length > 0){
    const levSection = e('div','stoz-lev-section');
    levSection.appendChild(e('div','stoz-org-label','Geïmplementeerde technologieën (uit goedgekeurde projecten)'));
    const levRow = e('div','stoz-lev-row');
    vd.leveranciers.forEach(l => {
      const pill = e('span','stoz-lev-pill');
      pill.innerHTML = `<span class="stoz-lev-badge">TECH</span>${l}`;
      levRow.appendChild(pill);
    });
    levSection.appendChild(levRow);
    wrap.appendChild(levSection);
  }

  // ── KENNISINSTITUUT-SECTIE ────────────────────────────────────────────
  wrap.appendChild(buildKennisSectie(proc, vd));

  // Footer
  const footer = e('div','stoz-footer');
  footer.innerHTML = `STOZ 2024/2025 · RVO · <a href="https://www.rvo.nl/subsidies-financiering/stoz" target="_blank" rel="noopener noreferrer" style="color:#856404">↗ rvo.nl</a>`;
  wrap.appendChild(footer);

  return wrap;
}


function buildKennisSectie(proc, vd){
  const d = STOZ_ROUTE_DATA[proc.stoz];
  const wrap = e('div','stoz-org-group');  // zelfde container als aanvragers

  // Label — conform de rest van de kaart
  const lbl = e('div','stoz-org-label');
  lbl.innerHTML = 'Kennisinstituut-participatie <span class="stoz-eval-eis-inline" title="Bij de Evaluatieroute is deelname van een kennisinstituut verplicht per STOZ-subsidieregeling">✶ verplicht bij Evaluatieroute</span>';
  wrap.appendChild(lbl);

  const kennisEntries = (vd && vd.kennis) ? vd.kennis : [];

  if(kennisEntries.length > 0){
    kennisEntries.forEach(([naam, type]) => {
      const tag = e('span','stoz-org-tag stoz-tag-kennis');
      tag.title = `${naam} — ${type} · Klik voor details`;
      tag.innerHTML = `🎓 ${naam} <span class="stoz-kennis-type">${type}</span>`;
      // onclick: open drawer met kennis-aanvrager als er een aanvrager is met dit kennis-type
      tag.onclick = () => {
        const vd2 = STOZ_VWS_DATA[proc.stoz] || STOZ_VWS_DATA[proc.naam] || null;
        const kennisAanvr = vd2 && vd2.aanvragers
          ? vd2.aanvragers.find(a => a.k && a.k === type)
          : null;
        if(kennisAanvr){
          openStozDrawer(proc, kennisAanvr);
        } else {
          // Fallback: open drawer met het proces, toon kennis in titel
          openStozDrawer(proc, {a: naam, k: type, l:[], r:'opsch'});
        }
      };
      wrap.appendChild(tag);
    });
  } else if(d && d.eval > 0){
    // Evaluatieroute aanwezig maar geen kennis gedetecteerd → amber waarschuwing
    const tag = e('span','stoz-org-tag stoz-tag-kennis-warn');
    tag.title = 'Evaluatieroute-projecten vereisen een kennisinstituut per subsidieregeling. Mogelijk ontbreekt informatie.';
    tag.innerHTML = `⚠ Evaluatieroute (${d.eval}×) — kennisinstituut niet gedetecteerd`;
    wrap.appendChild(tag);
  } else {
    // Geen data
    const tag = e('span','stoz-org-tag stoz-tag-kennis-empty');
    tag.title = 'Geen kennisinstituut-participatie gedetecteerd in de beschikbare RVO-data. Bij de Evaluatieroute is dit verplicht.';
    tag.innerHTML = '🎓 Kennisinstituut — niet bekend';
    tag.style.cursor = 'help';
    wrap.appendChild(tag);
  }
  return wrap;
}


function buildZonmwBand(proc, zm){
  const wrap = e('div','band');

  zm.segs.forEach(seg => {
    const s = e('div','tl-seg');
    s.style.width = seg.w + '%';
    s.style.background = seg.c;
    s.style.color = seg.tc;
    s.textContent = seg.w >= 12 ? seg.l : '';
    s.title = seg.l;
    bar.appendChild(s);
  });
  const nu = e('div','tl-nu');
  nu.style.left = nuPct + '%';
  tlWrap.appendChild(bar);
  tlWrap.appendChild(nu);

  const axis = e('div','tl-axis');
  zm.axis.forEach(t => {
    const tick = e('div','tl-tick'+(t.r?' right':''), t.l);
    tick.style.left = t.p+'%';

      const tag = e('span','org-tag');

      tag.onclick = ()=>openContactDrawer(a.k);

    g.appendChild(e('div','zm-org-group-label','Zorgaanbieders'));

      const tag = e('span','org-tag');
      tag.textContent = a.l;
      tag.onclick = ()=>openContactDrawer(a.k);
      g.appendChild(tag);
    });
    orgsRow.appendChild(g);
  }

  if(zm.vouchers && zm.vouchers.length){
    const g = e('div','zm-org-group');
    g.appendChild(e('div','zm-org-group-label','ZonMw Implementatie en Opschalingsvouchers (IOC)'));
    zm.vouchers.forEach(v => {
      const tag = e('span','voucher-tag');
      tag.innerHTML = `🏷️ ${v.l}`;
      tag.onclick = ()=>openContactDrawer(v.k);
      g.appendChild(tag);
    });
    orgsRow.appendChild(g);
  }

  wrap.appendChild(orgsRow);

  // STOZ cross-ref: show STOZ orgs for this process if STOZ data exists
  if(proc.stoz && STOZ_ROUTE_DATA[proc.stoz]){
    const d = STOZ_ROUTE_DATA[proc.stoz];
    const xref = e('div','stoz-cross-ref');
    xref.innerHTML = `<div class="v-lbl">Zorgorganisaties met STOZ-subsidie voor dit proces</div>`;
    const total = d.total || (d.impl + d.opsch + d.eval);
    const routeMap = [
      {key:'impl', count:d.impl,  cls:'route-impl',  label:'Impl.'},
      {key:'opsch',count:d.opsch, cls:'route-opsch', label:'Opsch.'},
      {key:'eval', count:d.eval,  cls:'route-eval',  label:'Eval. ✶'},
    ];
    routeMap.filter(r=>r.count>0).forEach(r=>{
      const pill = e('span','stoz-org-pill');
      pill.innerHTML = `<span class="stoz-badge">STOZ</span>${r.count} instellingen <span class="route-indicator-mini ${r.cls}">${r.label}</span>`;
      pill.onclick = ()=>openStozDrawer(proc);
      xref.appendChild(pill);
    });
    wrap.appendChild(xref);
  }

  return wrap;

  if(proc._implkaart)   return buildImplKaart(proc);
  const card = e('div','card');
  card.dataset.procIdx = procIdx;

  const headLeft = e('div','card-head-left');

  const pills = e('div','card-pills');

  head.appendChild(badges);

  // ZonMw band — EERST (meest inhoudelijk relevant voor zorgveld)
  if(proc.zonmw){
    const zm = ZONMW_CARDS[proc.zonmw];
    if(zm){
      card.appendChild(buildZonmwBand(proc, zm));

      const band = e('div','band');

function computeFiltered(){
  filteredIndices = DIGIZO_PROCESSEN
    .map((_,i)=>i)
    .filter(i => bronMatch(DIGIZO_PROCESSEN[i], currentBron) && sectorMatch(DIGIZO_PROCESSEN[i], currentSector));
}

function showCard(pos){
  document.querySelectorAll('.card').forEach(c=>c.classList.remove('visible'));
  const pips = document.querySelectorAll('.pip');
  pips.forEach((p,i)=>p.classList.toggle('active', i===pos));

  if(filteredIndices.length === 0){
    document.getElementById('ddx-nav-counter').textContent = '0 / 0';
    document.getElementById('ddx-btn-prev').disabled = true;
    document.getElementById('ddx-btn-next').disabled = true;
    return;
  }

  currentIdx = Math.max(0, Math.min(pos, filteredIndices.length-1));
  const procIdx = filteredIndices[currentIdx];
  const card = document.querySelector(`.card[data-proc-idx="${procIdx}"]`);
  if(card) card.classList.add('visible');

  document.getElementById('ddx-nav-counter').textContent = `${currentIdx+1} / ${filteredIndices.length}`;
  document.getElementById('ddx-btn-prev').disabled = currentIdx === 0;
  document.getElementById('ddx-btn-next').disabled = currentIdx === filteredIndices.length-1;

  closeDrawer();
  syncURL();
}

function buildPips(){
  const pipsEl = document.getElementById('ddx-pips');
  pipsEl.innerHTML = '';
  filteredIndices.forEach((procIdx, pos) => {
    const pip = e('div','pip');
    const proc = DIGIZO_PROCESSEN[procIdx];
    pip.title = proc.naam;
    pip.onclick = ()=>showCard(pos);
    pipsEl.appendChild(pip);
  });
}

function navigate(dir){
  showCard(currentIdx + dir);
}

function showInfoKaart(){
  // Navigeer naar de STOZ-infokaart (aparte kaart in de machine)
  const infoIdx = DIGIZO_PROCESSEN.findIndex(p => p._infokaart === true);
  if(infoIdx > -1){
    const pos = filteredIndices.indexOf(infoIdx);
    if(pos > -1) showCard(pos);
    else window.open('https://www.rvo.nl/subsidies-financiering/stoz/aanvraagproces','_blank');
  } else {
    // Fallback: open RVO-pagina
    window.open('https://www.rvo.nl/subsidies-financiering/stoz/aanvraagproces','_blank');
  }
}

function filterBron(bron){
  currentBron = bron;
  document.querySelectorAll('.src-btn').forEach(b=>b.classList.remove('active'));
  document.querySelector('.src-btn[data-bron="'+bron+'"]')?.classList.add('active');
  currentIdx = 0;
  computeFiltered();
  buildPips();
  showCard(0);
  buildSectorTabs(); // rebuild tabs with updated counts
  syncURL();
}

function filterSector(sec){
  currentSector = sec;
  currentIdx = 0;
  computeFiltered();
  buildPips();
  showCard(0);
  buildSectorTabs();
  syncURL();
}

// ─────────────────────────────────────────────
// SECTOR TABS
// ─────────────────────────────────────────────
const ALL_SECTORS = ['VVT','GGZ','HA','HAP','MSZ','SD'];

function buildSectorTabs(){
  const container = document.getElementById('ddx-sector-tabs');
  container.innerHTML = '';

  const allCount = DIGIZO_PROCESSEN.filter(p=>bronMatch(p,currentBron)).length;
  const allTab = e('button','sec-tab'+(currentSector==='all'?' active':''));
  allTab.innerHTML = `Alle <span class="tab-count">${allCount}</span>`;
  if(currentSector==='all') allTab.style.background='var(--dz-navy)';
  allTab.onclick = ()=>filterSector('all');
  container.appendChild(allTab);

  ALL_SECTORS.forEach(sec=>{
    const count = DIGIZO_PROCESSEN.filter(p=>p.sectoren.includes(sec) && bronMatch(p,currentBron)).length;
    const c = SEC_COLORS[sec];
    const tab = e('button','sec-tab'+(currentSector===sec?' active':''));
    tab.innerHTML = `${sec} <span class="tab-count">${count}</span>`;
    if(currentSector===sec){
      tab.style.background = c.fg;
      tab.style.borderColor = c.fg;
    }
    tab.onclick = ()=>filterSector(sec);
    container.appendChild(tab);
  });
}

// ─────────────────────────────────────────────
// SOURCE COUNTS
// ─────────────────────────────────────────────
function updateSourceCounts(){
  const all = DIGIZO_PROCESSEN.length;
  const stoz = DIGIZO_PROCESSEN.filter(p=>hasStoz(p)).length;
  const zonmw = DIGIZO_PROCESSEN.filter(p=>hasZonmw(p)).length;
  const both = DIGIZO_PROCESSEN.filter(p=>hasStoz(p)&&hasZonmw(p)).length;
  document.getElementById('ddx-cnt-all').textContent = all;
  document.getElementById('ddx-cnt-stoz').textContent = stoz;
  document.getElementById('ddx-cnt-zonmw').textContent = zonmw;
  document.getElementById('ddx-cnt-both').textContent = both;
}

// ─────────────────────────────────────────────
// ─────────────────────────────────────────────
// URL STATE SYNC
// ─────────────────────────────────────────────
function getStateParams(){
  var p = new URLSearchParams();
  if(currentBron !== 'all') p.set('bron', currentBron);
  if(currentSector !== 'all') p.set('sector', currentSector);
  if(currentIdx > 0) p.set('kaart', currentIdx);
  return p;
}
function syncURL(){
  var params = getStateParams();
  try { history.replaceState(null, '', location.pathname + (params.toString() ? '?' + params.toString() : '')); } catch(e){}
}
function loadFromURL(){
  var p = new URLSearchParams(location.search);
  if(p.has('bron'))   currentBron   = p.get('bron');
  if(p.has('sector')) currentSector = p.get('sector');
  if(p.has('kaart'))  currentIdx    = parseInt(p.get('kaart')) || 0;
}
function copyStateLink(){
  var url = location.origin + location.pathname + '?' + getStateParams().toString();
  navigator.clipboard.writeText(url).then(function(){
    var btn = document.getElementById('ddx-copy-link-btn');
    if(btn){ var orig = btn.textContent; btn.textContent = '✓ Gekopieerd!'; setTimeout(function(){ btn.textContent = orig; }, 2000); }
  });
}

// ─────────────────────────────────────────────
// VALIDATIE
// ─────────────────────────────────────────────
function validateData(){
  var missing = DIGIZO_PROCESSEN.filter(function(p){ return p.stoz && !STOZ_ROUTE_DATA[p.stoz]; });
  if(missing.length) console.warn('Processen zonder STOZ-data:', missing.map(function(p){ return p.naam; }));
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init(){
  loadFromURL();
  // Build all cards into slot
  const slot = document.getElementById('ddx-card-slot');
  DIGIZO_PROCESSEN.forEach((_,i)=>{
    slot.appendChild(buildCard(i));
  });

  updateSourceCounts();
  computeFiltered();
  buildPips();
  buildSectorTabs();
  showCard(currentIdx || 0);
}



// ── Window exports (for inline onclick= handlers in HTML) ──
window.filterBron      = filterBron;
window.filterSector    = filterSector;
window.navigate        = navigate;
window.closeDrawer     = closeDrawer;
window.closeImplDrawer = closeImplDrawer;
window.closeImplDetail = closeImplDetail;
window.copyStateLink   = copyStateLink;
window.showInfoKaart   = showInfoKaart;
window.openImplDrawer  = openImplDrawer;
window.openImplDetail  = openImplDetail;
window.openContactDrawer = typeof openContactDrawer !== 'undefined' ? openContactDrawer : null;
window.openStozDrawer  = typeof openStozDrawer !== 'undefined' ? openStozDrawer : null;




// ═══ UNIFIED INIT ════════════════════════════════════════
document.addEventListener('DOMContentLoaded', function() {
  MAP_initKaart();
  validateData();
  init();
});
</script>
</body>
</html>
